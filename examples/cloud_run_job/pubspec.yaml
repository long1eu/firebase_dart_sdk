name: cloud_run_job
description: >-
  A one-shot job: Firestore aggregation queries, a transaction and retries with
  backoff, compiled to a native binary for Cloud Run Jobs.
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  cloud_firestore_dart:
    path: ../../cloud_firestore/cloud_firestore_dart
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_auth_providers_dart:
    path: ../../firebase_auth/firebase_auth_providers_dart

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# The examples run against the code of this repository. Each package declares
# the others as hosted dependencies (^0.1.0): the overrides make every one of
# them come from this repository. Outside the repository, remove this section
# and depend on the versions on pub.dev.
dependency_overrides:
  cloud_firestore_dart:
    path: ../../cloud_firestore/cloud_firestore_dart
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_auth_providers_dart:
    path: ../../firebase_auth/firebase_auth_providers_dart
