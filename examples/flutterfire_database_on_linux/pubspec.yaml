name: flutterfire_database_on_linux
description: >-
  A Flutter Linux desktop app written against the official FlutterFire API
  (firebase_core, firebase_database), running on firebase_database_dart through
  firebase_database_dart_platform.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  # The official FlutterFire packages: the app code imports only these two.
  firebase_core: ^5.1.0
  firebase_database: ^13.1.0
  # Implements firebase_database (and firebase_core) on Linux. Flutter registers
  # it before main() through its dartPluginClass; the app does not import it.
  firebase_database_dart_platform: ^0.0.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

# firebase_database_dart_platform is not on pub.dev yet: the overrides make it
# and the packages under it come from this repository. Outside the repository,
# remove this section and depend on the versions on pub.dev.
dependency_overrides:
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_database_dart:
    path: ../../firebase_database/firebase_database_dart
  firebase_database_dart_platform:
    path: ../../firebase_database/firebase_database_dart_platform

flutter:
  uses-material-design: true
