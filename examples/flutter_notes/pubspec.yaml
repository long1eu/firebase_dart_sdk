name: flutter_notes
description: >-
  A Flutter notes app on cloud_firestore_dart: a real-time list, offline edits
  in a SQLite cache, connectivity events and a clean shutdown.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  cloud_firestore_dart: ^0.1.0
  connectivity_plus: ^7.3.2
  firebase_app_dart: ^0.1.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  rxdart: ^0.28.0
  # sqlite_database.dart is written for the 2.x API of package:sqlite3
  # (package:sqlite3/open.dart). sqlite3_flutter_libs bundles the native
  # library with the app; its 0.5.x releases go with sqlite3 2.x.
  sqlite3: ^2.7.3
  sqlite3_flutter_libs: ^0.5.40

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
