name: flutter_notes
description: >-
  A Flutter notes app on cloud_firestore_dart: a real-time list, offline edits
  in a SQLite cache, connectivity events and a clean shutdown.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  cloud_firestore_dart: ^0.2.0
  # The SQLite cache. It brings sqlite3 3.x on this Flutter, whose build hook
  # bundles SQLite with the app: no sqlite3_flutter_libs.
  cloud_firestore_dart_sqlite: ^0.1.0
  connectivity_plus: ^7.3.2
  firebase_app_dart: ^0.2.0
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  rxdart: ^0.28.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
