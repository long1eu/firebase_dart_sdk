name: flutterfire_database_on_windows
description: >-
  A Flutter Windows desktop app written against the official FlutterFire API
  (firebase_core, firebase_database), running on firebase_database_dart
  through firebase_database_dart_platform instead of the native Realtime
  Database plugin.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  # The official FlutterFire packages: the app code imports only these two,
  # and lib/dart_database.dart for the optional disk cache.
  firebase_core: ^5.1.0
  firebase_database: ^13.1.0
  # Implements firebase_database. As a direct dependency it replaces the
  # native Windows plugin, and Flutter registers it before main() through its
  # dartPluginClass. firebase_core stays native.
  firebase_database_dart_platform: ^0.0.1
  # The SQLite cache of the optional disk cache (--dart-define=DISK_CACHE=true).
  firebase_database_dart_sqlite: ^0.0.1
  flutter:
    sdk: flutter
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

# firebase_database_dart_platform and the packages under it are not on pub.dev
# yet: the overrides take them from this repository. Outside the repository,
# remove this section and depend on the versions on pub.dev.
dependency_overrides:
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_database_dart:
    path: ../../firebase_database/firebase_database_dart
  firebase_database_dart_platform:
    path: ../../firebase_database/firebase_database_dart_platform
  firebase_database_dart_sqlite:
    path: ../../firebase_database/firebase_database_dart_sqlite

flutter:
  uses-material-design: true
