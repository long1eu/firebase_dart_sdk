name: web_app
description: >-
  A browser app in plain Dart (package:web, no Flutter): a real-time list, a
  form that adds a document, an online/offline indicator, a memory or SQLite
  cache, and a second page on Firestore Lite.
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  cloud_firestore_dart: ^0.2.0
  # The SQLite cache in the browser (IndexedDB or OPFS).
  cloud_firestore_dart_sqlite: ^0.1.0
  firebase_app_dart: ^0.2.0
  path: ^1.9.0
  # Pinned: the sqlite3.wasm file next to the page must be the build of this
  # exact version (see README.md), and 2.9.4 is the version the browser cache
  # of cloud_firestore_dart_sqlite was tested with.
  sqlite3: 2.9.4
  web: ^1.1.0

dev_dependencies:
  lints: ^6.0.0

# The multi-tab IndexedDB cache (?multiTab=1) is not on pub.dev yet: the
# overrides make the packages come from this repository. Outside the
# repository, remove this section and depend on the versions on pub.dev.
dependency_overrides:
  cloud_firestore_dart:
    path: ../../cloud_firestore/cloud_firestore_dart
  cloud_firestore_dart_sqlite:
    path: ../../cloud_firestore/cloud_firestore_dart_sqlite
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
