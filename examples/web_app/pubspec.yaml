name: web_app
description: >-
  A browser app in plain Dart (package:web, no Flutter): a real-time list, a
  form that adds a document, an online/offline indicator, a memory or SQLite
  cache, and a second page on Firestore Lite.
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  cloud_firestore_dart: ^0.1.0
  firebase_app_dart: ^0.1.0
  path: ^1.9.0
  # Pinned: the sqlite3.wasm file next to the page must be the build of this
  # exact version (see README.md). lib/sqlite_database_web.dart needs 2.7.3 or
  # later and is written for the 2.x API.
  sqlite3: 2.9.4
  web: ^1.1.0

dev_dependencies:
  lints: ^6.0.0
