name: rtdb_presence_worker
description: >-
  A long-running worker that keeps a presence record in the Realtime Database
  with onDisconnect, a heartbeat and a clean stop, plus a watcher that lists
  who is online.
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  firebase_app_dart: ^0.2.0
  firebase_database_dart: ^0.1.0

dev_dependencies:
  lints: ^6.0.0

# The examples run against the code of this repository.
dependency_overrides:
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_database_dart:
    path: ../../firebase_database/firebase_database_dart
