name: remote_config_web
description: >-
  A browser app in plain Dart (package:web, no Flutter) on firebase_remote_config_dart:
  fetch and activate, a table of the values, and a log of realtime updates.
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  firebase_app_dart: ^0.2.0
  firebase_installations_dart: ^0.1.0
  firebase_remote_config_dart: ^0.1.0
  web: ^1.1.0

dev_dependencies:
  lints: ^6.1.0

# The packages come from this repository. Outside it, remove this section and
# depend on the versions on pub.dev. The two new packages are overridden as well
# as depended on: firebase_remote_config_dart asks for firebase_installations_dart
# from pub.dev, and pub refuses a path for the same package without an override.
dependency_overrides:
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_installations_dart:
    path: ../../firebase_installations/firebase_installations_dart
  firebase_remote_config_dart:
    path: ../../firebase_remote_config/firebase_remote_config_dart
