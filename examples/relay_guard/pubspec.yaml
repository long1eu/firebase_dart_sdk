name: relay_guard
description: >-
  The checks every relay of this repository makes before it forwards a request
  with its own credentials: the App Check token, the Firebase ID token, the
  size of the body and a rate limit per caller, as package:shelf middleware.
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  firebase_admin_dart:
    path: ../../firebase_admin/firebase_admin_dart
  shelf: ^1.4.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# The examples run against the code of this repository. Outside the repository, remove this section and depend
# on the versions on pub.dev.
dependency_overrides:
  firebase_admin_dart:
    path: ../../firebase_admin/firebase_admin_dart
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_auth_providers_dart:
    path: ../../firebase_auth/firebase_auth_providers_dart
  secure_flow:
    path: ../../secure_flow/secure_flow
