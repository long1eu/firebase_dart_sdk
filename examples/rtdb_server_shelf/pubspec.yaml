name: rtdb_server_shelf
description: >-
  An HTTP API on package:shelf over one shared Realtime Database client: REST
  routes over a list of notes and a server-sent events stream of a path.
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_database_dart:
    path: ../../firebase_database/firebase_database_dart
  shelf: ^1.4.0
  shelf_router: ^1.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# The examples run against the code of this repository: the overrides make
# every package come from it. Outside the repository, remove this section and
# depend on the versions on pub.dev.
dependency_overrides:
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_database_dart:
    path: ../../firebase_database/firebase_database_dart
  secure_flow:
    path: ../../secure_flow/secure_flow
