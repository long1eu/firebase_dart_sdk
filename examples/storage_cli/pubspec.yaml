name: storage_cli
description: >-
  A command-line tool for Cloud Storage for Firebase: list, upload with a
  progress line, download to a file, print, inspect, delete and get the
  download URL of objects.
publish_to: none

environment:
  sdk: ^3.8.0

executables:
  storage_cli:

dependencies:
  args: ^2.5.0
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_auth_providers_dart:
    path: ../../firebase_auth/firebase_auth_providers_dart
  firebase_storage_dart:
    path: ../../firebase_storage/firebase_storage_dart

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

# The examples run against the code of this repository. Each package declares
# the others as hosted dependencies: the overrides make every one of them come
# from this repository. Outside the repository, remove this section and depend
# on the versions on pub.dev.
dependency_overrides:
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_auth_providers_dart:
    path: ../../firebase_auth/firebase_auth_providers_dart
  firebase_storage_dart:
    path: ../../firebase_storage/firebase_storage_dart
  secure_flow:
    path: ../../secure_flow/secure_flow
