name: rtdb_web_app
description: >-
  A browser app in plain Dart (package:web, no Flutter) on firebase_database_dart:
  a live list, a form that pushes an item, a connection indicator, a go
  offline / go online button, and a panel to connect your own emulator or project.
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  firebase_app_dart: ^0.2.0
  firebase_database_dart: ^0.0.1
  web: ^1.1.0

dev_dependencies:
  lints: ^6.0.0

# The packages come from this repository. Outside it, remove this section and
# depend on the versions on pub.dev.
dependency_overrides:
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_database_dart:
    path: ../../firebase_database/firebase_database_dart
