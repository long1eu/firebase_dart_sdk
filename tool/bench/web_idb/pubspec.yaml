name: web_idb_bench
description: >-
  Measurements for an IndexedDB cache engine on the web (docs/spikes/indexeddb_cache.md).
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  cloud_firestore_dart:
    path: ../../../cloud_firestore/cloud_firestore_dart
  cloud_firestore_dart_sqlite:
    path: ../../../cloud_firestore/cloud_firestore_dart_sqlite
  firebase_app_dart:
    path: ../../../firebase_core/firebase_app_dart
  sqlite3: '>=2.7.3 <4.0.0'
  web: ^1.1.0

dependency_overrides:
  cloud_firestore_dart:
    path: ../../../cloud_firestore/cloud_firestore_dart
  firebase_app_dart:
    path: ../../../firebase_core/firebase_app_dart
