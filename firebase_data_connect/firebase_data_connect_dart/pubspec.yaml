name: firebase_data_connect_dart
description: >-
  Firebase Data Connect for pure Dart: GraphQL queries and mutations of a
  connector, over gRPC on the VM and REST on the web.
version: 0.1.0
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/firebase_data_connect/firebase_data_connect_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - data-connect
  - graphql

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  # Local development resolves the two internal packages from the sibling
  # directories through pubspec_overrides.yaml (not published yet).
  _firebase_transport_dart: ^0.1.0
  firebase_app_dart: ^0.2.3
  # 1.6.0: AbortableRequest, and BrowserClient streams response bodies.
  http: ^1.6.0
  meta: ^1.11.0
  # Generated messages (protoc_plugin 25.1.0). Imported only from
  # lib/src/transport/grpc/, which the web build never reaches.
  protobuf: ^6.1.0

dev_dependencies:
  fake_async: ^1.3.0
  lints: ^6.1.0
  test: ^1.25.0

executables:
  rewrite_generated:
