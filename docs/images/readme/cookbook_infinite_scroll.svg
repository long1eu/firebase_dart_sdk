  <text x="179.0" y="117" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m10</text>
  <rect x="216" y="92" width="58" height="40" rx="6" fill="#ddf4ff" stroke="#57606a" stroke-width="1"/>
  <text x="245.0" y="117" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m20</text>
  <rect x="282" y="92" width="58" height="40" rx="6" fill="#ddf4ff" stroke="#57606a" stroke-width="1"/>
  <text x="311.0" y="117" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m30</text>
  <rect x="374" y="92" width="58" height="40" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="403.0" y="117" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m40</text>
  <rect x="440" y="92" width="58" height="40" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="469.0" y="117" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m50</text>
  <rect x="506" y="92" width="58" height="40" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="535.0" y="117" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m60</text>
  <rect x="598" y="92" width="58" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
  <text x="627.0" y="117" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m70</text>
  <rect x="664" y="92" width="58" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
  <text x="693.0" y="117" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m80</text>
  <text x="20" y="222" font-size="12" fill="#1f2328" font-weight="600">After m45 is added</text>
  <rect x="150" y="196" width="58" height="40" rx="6" fill="#ddf4ff" stroke="#57606a" stroke-width="1"/>
  <text x="179.0" y="221" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m10</text>
  <rect x="216" y="196" width="58" height="40" rx="6" fill="#ddf4ff" stroke="#57606a" stroke-width="1"/>
  <text x="245.0" y="221" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m20</text>
  <rect x="282" y="196" width="58" height="40" rx="6" fill="#ddf4ff" stroke="#57606a" stroke-width="1"/>
  <text x="311.0" y="221" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m30</text>
  <rect x="374" y="196" width="58" height="40" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="403.0" y="221" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m40</text>
  <rect x="440" y="196" width="58" height="40" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="2.5" stroke-dasharray="4 2"/>
  <text x="469.0" y="221" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m45</text>
  <text x="469.0" y="252" font-size="11" fill="#1a7f37" font-weight="700" text-anchor="middle">new</text>
  <rect x="506" y="196" width="58" height="40" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="535.0" y="221" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m50</text>
  <rect x="572" y="196" width="58" height="40" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="601.0" y="221" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m60</text>
  <rect x="664" y="196" width="58" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
  <text x="693.0" y="221" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m70</text>
  <rect x="730" y="196" width="58" height="40" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1"/>
  <text x="759.0" y="221" font-size="13" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m80</text>
  <path d="M374,190 L374,182 L630,182 L630,190" stroke="#1f2328" stroke-width="1.5" fill="none"/>
  <text x="374" y="174" font-size="11" fill="#57606a">same bounds, m40 to m60: page 2 now has 4 documents</text>
  <text x="20" y="296" font-size="11" fill="#57606a">Each page is read once with limit(3), after the last document of the page before, to find its first and last</text>
  <text x="20" y="314" font-size="11" fill="#57606a">document. Its listener is then bounded by those two documents, not by a limit. (infinite_scroll.dart, three per page.)</text>
</svg>
