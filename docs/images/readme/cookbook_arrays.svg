  <text x="580" y="116" font-size="18" fill="#57606a">[</text>
  <rect x="592.0" y="96" width="63.2" height="28" rx="14" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="623.6" y="115" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">'dart'</text>
  <rect x="661.2" y="96" width="104.2" height="28" rx="14" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="713.3" y="115" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">'firestore'</text>
  <text x="771.4000000000001" y="116" font-size="18" fill="#57606a">]</text>
  <text x="20" y="188" font-size="18" fill="#57606a">[</text>
  <rect x="32.0" y="168" width="63.2" height="28" rx="14" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="63.6" y="187" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">'news'</text>
  <rect x="101.2" y="168" width="63.2" height="28" rx="14" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="132.8" y="187" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">'dart'</text>
  <rect x="170.4" y="168" width="63.2" height="28" rx="14" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="202.0" y="187" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">'news'</text>
  <text x="239.59999999999997" y="188" font-size="18" fill="#57606a">]</text>
  <line x1="300" y1="182" x2="550" y2="182" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="425" y="174" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">arrayRemove(['news'])</text>
  <text x="425" y="200" font-size="11" fill="#57606a" text-anchor="middle">every copy is removed</text>
  <text x="580" y="188" font-size="18" fill="#57606a">[</text>
  <rect x="592.0" y="168" width="63.2" height="28" rx="14" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="623.6" y="187" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">'dart'</text>
  <text x="661.2" y="188" font-size="18" fill="#57606a">]</text>
  <text x="20" y="260" font-size="18" fill="#57606a">[</text>
  <rect x="32.0" y="240" width="22.2" height="28" rx="14" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="43.1" y="259" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1</text>
  <rect x="60.2" y="240" width="22.2" height="28" rx="14" fill="#f6f8fa" stroke="#57606a" stroke-width="1"/>
  <text x="71.3" y="259" font-size="13" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2</text>
  <text x="88.4" y="260" font-size="18" fill="#57606a">]</text>
  <line x1="300" y1="254" x2="550" y2="254" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="425" y="246" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">arrayUnion([1.0])</text>
  <text x="425" y="272" font-size="11" fill="#57606a" text-anchor="middle">1 and 1.0 are the same element</text>
  <text x="580" y="260" font-size="18" fill="#57606a">[</text>
