<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Paging with a document cursor</title>
  <desc id="desc">Eleven documents ordered by day: a and b on day 1, c on day 2, d and e on day 3, f on 4, g and h on 5, i on 6, j on 7, k on 8. Page 1 is orderBy day with limit 4: a, b, c, d. Page 2 starts after document d: e, f, g, h. Page 3 starts after document h and has only i, j, k, so it is the last page. d and e share day 3; the cursor holds the document id too, so e is neither skipped nor repeated.</desc>
  <style id="figure-theme">
    /* Palette shared by every figure in docs/images (see docs/images/README.md). */
    :root {
      --fig-bg: #ffffff;
      --fig-panel: #f6f8fa;
      --fig-panel-strong: #eaeef2;
      --fig-border: #d0d7de;
      --fig-grid: #eaeef2;
      --fig-fg: #1f2328;
      --fig-fg-muted: #57606a;
      --fig-faint: #818b98;
      --fig-bar: #6e7781;
      --fig-on-bar: #ffffff;
      --fig-on-accent: #ffffff;
      --fig-accent: #0969da;
      --fig-accent-bg: #ddf4ff;
      --fig-success: #1a7f37;
      --fig-success-bg: #dafbe1;
      --fig-danger: #cf222e;
      --fig-attention: #9a6700;
      --fig-severe: #bc4c00;
      --fig-severe-bg: #fff1e5;
      --fig-done: #8250df;
      --fig-done-bg: #fbefff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-bg: #0d1117;
        --fig-panel: #151b23;
        --fig-panel-strong: #212830;
        --fig-border: #3d444d;
        --fig-grid: #2a313c;
        --fig-fg: #f0f6fc;
        --fig-fg-muted: #9198a1;
        --fig-faint: #7d8590;
        --fig-bar: #6e7781;
        --fig-on-bar: #ffffff;
        --fig-on-accent: #0d1117;
        --fig-accent: #4493f8;
        --fig-accent-bg: #12294a;
        --fig-success: #3fb950;
        --fig-success-bg: #132a1c;
        --fig-danger: #f85149;
        --fig-attention: #d29922;
        --fig-severe: #db6d28;
        --fig-severe-bg: #2b1c12;
        --fig-done: #ab7df8;
        --fig-done-bg: #231c38;
      }
    }
    [fill="#ffffff"] { fill: var(--fig-bg); }
    [fill="#f6f8fa"] { fill: var(--fig-panel); }
    [fill="#1f2328"] { fill: var(--fig-fg); }
    [fill="#57606a"] { fill: var(--fig-fg-muted); }
    [fill="#0969da"] { fill: var(--fig-accent); }
    [fill="#ddf4ff"] { fill: var(--fig-accent-bg); }
    [stroke="#d0d7de"] { stroke: var(--fig-border); }
    [stroke="#1f2328"] { stroke: var(--fig-fg); }
    [stroke="#57606a"] { stroke: var(--fig-fg-muted); }
    [stroke="#0969da"] { stroke: var(--fig-accent); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
  <rect x="0" y="0" width="900" height="290" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M40,66 L40,58 L326,58 L326,66" stroke="#1f2328" stroke-width="1.5" fill="none"/>
  <text x="40" y="50" font-size="12" fill="#1f2328" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">orderBy('day').limit(4)</text>
  <text x="40" y="34" font-size="11" fill="#57606a">page 1</text>
  <path d="M336,66 L336,58 L622,58 L622,66" stroke="#1f2328" stroke-width="1.5" fill="none"/>
  <text x="336" y="50" font-size="12" fill="#1f2328" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.startAfterDocument(d)</text>
  <text x="336" y="34" font-size="11" fill="#57606a">page 2</text>
  <path d="M632,66 L632,58 L844,58 L844,66" stroke="#1f2328" stroke-width="1.5" fill="none"/>
  <text x="632" y="50" font-size="12" fill="#1f2328" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.startAfterDocument(h)</text>
  <text x="632" y="34" font-size="11" fill="#57606a">page 3: fewer than 4, the last one</text>
  <rect x="40" y="76" width="64" height="56" rx="6" fill="#ddf4ff" stroke="#57606a"/>
  <text x="72.0" y="100" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">a</text>
  <text x="72.0" y="120" font-size="11" fill="#57606a" text-anchor="middle">day 1</text>
  <rect x="114" y="76" width="64" height="56" rx="6" fill="#ddf4ff" stroke="#57606a"/>
  <text x="146.0" y="100" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">b</text>
  <text x="146.0" y="120" font-size="11" fill="#57606a" text-anchor="middle">day 1</text>
  <rect x="188" y="76" width="64" height="56" rx="6" fill="#ddf4ff" stroke="#57606a"/>
  <text x="220.0" y="100" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">c</text>
  <text x="220.0" y="120" font-size="11" fill="#57606a" text-anchor="middle">day 2</text>
  <rect x="262" y="76" width="64" height="56" rx="6" fill="#ddf4ff" stroke="#57606a"/>
  <text x="294.0" y="100" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">d</text>
  <text x="294.0" y="120" font-size="11" fill="#57606a" text-anchor="middle">day 3</text>
  <rect x="336" y="76" width="64" height="56" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="368.0" y="100" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">e</text>
  <text x="368.0" y="120" font-size="11" fill="#57606a" text-anchor="middle">day 3</text>
  <rect x="410" y="76" width="64" height="56" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="442.0" y="100" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">f</text>
  <text x="442.0" y="120" font-size="11" fill="#57606a" text-anchor="middle">day 4</text>
  <rect x="484" y="76" width="64" height="56" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="516.0" y="100" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">g</text>
  <text x="516.0" y="120" font-size="11" fill="#57606a" text-anchor="middle">day 5</text>
  <rect x="558" y="76" width="64" height="56" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="590.0" y="100" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h</text>
  <text x="590.0" y="120" font-size="11" fill="#57606a" text-anchor="middle">day 5</text>
  <rect x="632" y="76" width="64" height="56" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="664.0" y="100" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">i</text>
  <text x="664.0" y="120" font-size="11" fill="#57606a" text-anchor="middle">day 6</text>
  <rect x="706" y="76" width="64" height="56" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="738.0" y="100" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">j</text>
  <text x="738.0" y="120" font-size="11" fill="#57606a" text-anchor="middle">day 7</text>
  <rect x="780" y="76" width="64" height="56" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="812.0" y="100" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">k</text>
  <text x="812.0" y="120" font-size="11" fill="#57606a" text-anchor="middle">day 8</text>
  <line x1="331.0" y1="70" x2="331.0" y2="160" stroke="#0969da" stroke-width="2.5" stroke-dasharray="5 3"/>
  <line x1="627.0" y1="70" x2="627.0" y2="160" stroke="#0969da" stroke-width="2.5" stroke-dasharray="5 3"/>
  <path d="M331.0,160 l-6,10 l12,0 z" fill="#0969da"/>
  <text x="181.0" y="188" font-size="12" fill="#1f2328" font-weight="600">cursor: document d (day 3, id d).</text>
  <text x="181.0" y="204" font-size="12" fill="#57606a">e has the same day; the id in the cursor keeps it in page 2,</text>
  <text x="181.0" y="220" font-size="12" fill="#57606a">not skipped and not repeated.</text>
  <text x="20" y="274" font-size="11" fill="#57606a">Pages of 4 here; the recipe uses 20. Each page is one query that starts after the last document of the page before.</text>
</svg>
