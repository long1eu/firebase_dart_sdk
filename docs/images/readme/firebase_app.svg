<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">What a FirebaseApp holds and who reads it</title>
  <desc id="desc">A FirebaseApp holds its name, its FirebaseOptions, a token provider (authProvider), an App Check token provider (appCheckProvider) and the platform dependencies (connectivity events and storage). The token provider is set by FirebaseUserAuth.forApp or assigned from OAuthTokenProvider or your own provider; without one, requests carry no token. The App Check provider is yours. The platform dependencies are passed to FirebaseApp.withOptions. Firestore.instanceFor(app: app) reads the options, both providers and the connectivity events once, when the instance is created, and app.delete() terminates the Firestore instances of the app.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Inputs, left -->
  <text x="20" y="32" font-size="13" font-weight="600" fill="#57606a">YOU SET</text>
  <g font-size="12" fill="#1f2328">
    <rect x="20" y="44" width="250" height="52" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="32" y="65" font-weight="600">FirebaseApp.withOptions(options)</text>
    <text x="32" y="83" fill="#57606a">values from the Firebase console</text>

    <rect x="20" y="112" width="250" height="88" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-dasharray="5 3"/>
    <text x="32" y="133" font-weight="600">a token provider</text>
    <text x="32" y="151">FirebaseUserAuth.forApp(app),</text>
    <text x="32" y="167">OAuthTokenProvider, or your own</text>
    <text x="32" y="187" fill="#57606a">firebase_auth_providers_dart</text>

    <rect x="20" y="216" width="250" height="52" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-dasharray="5 3"/>
    <text x="32" y="237" font-weight="600">an App Check token provider</text>
    <text x="32" y="255" fill="#57606a">yours; nothing attests a device here</text>

    <rect x="20" y="284" width="250" height="52" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-dasharray="5 3"/>
    <text x="32" y="305" font-weight="600">PlatformDependencies</text>
    <text x="32" y="323" fill="#57606a">passed to withOptions(dependencies:)</text>
  </g>
  <text x="20" y="362" font-size="11" fill="#57606a">Dashed outline: optional.</text>

  <!-- The app, centre -->
  <rect x="330" y="20" width="260" height="330" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="460" y="46" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">FirebaseApp</text>
  <g font-size="12" fill="#1f2328">
    <rect x="346" y="60" width="228" height="40" rx="6" fill="#ffffff" stroke="#57606a"/>
    <text x="358" y="78" font-weight="600">options</text>
    <text x="358" y="93" fill="#57606a">apiKey, applicationId, projectId</text>
    <rect x="346" y="126" width="228" height="62" rx="6" fill="#ffffff" stroke="#57606a"/>
    <text x="358" y="148" font-weight="600">authProvider</text>
    <text x="358" y="166" fill="#57606a">none set: requests carry</text>
    <text x="358" y="180" fill="#57606a">no token</text>
    <rect x="346" y="222" width="228" height="40" rx="6" fill="#ffffff" stroke="#57606a"/>
    <text x="358" y="240" font-weight="600">appCheckProvider</text>
    <text x="358" y="255" fill="#57606a">null unless set</text>
    <rect x="346" y="290" width="228" height="44" rx="6" fill="#ffffff" stroke="#57606a"/>
    <text x="358" y="308" font-weight="600">onNetworkConnected, storage</text>
    <text x="358" y="325" fill="#57606a">defaults when not passed</text>
  </g>

  <g stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <line x1="270" y1="70" x2="343" y2="80"/>
    <line x1="270" y1="156" x2="343" y2="156"/>
    <line x1="270" y1="242" x2="343" y2="242"/>
    <line x1="270" y1="310" x2="343" y2="312"/>
  </g>

  <!-- Reader, right -->
  <rect x="660" y="96" width="220" height="126" rx="8" fill="#ffffff" stroke="#1f2328"/>
  <text x="770" y="124" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Firestore.instanceFor</text>
  <text x="770" y="141" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">(app: app)</text>
  <g font-size="12" fill="#1f2328">
    <text x="672" y="164">reads options, both providers</text>
    <text x="672" y="180">and the connectivity events</text>
    <text x="672" y="200" font-weight="600">once, when it is created:</text>
    <text x="672" y="214" font-weight="600" font-size="11">set the providers first</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="590" y1="160" x2="657" y2="160"/>
  </g>

  <rect x="660" y="262" width="220" height="72" rx="8" fill="#ffffff" stroke="#1f2328"/>
  <text x="672" y="286" font-size="13" font-weight="700" fill="#1f2328">app.delete()</text>
  <text x="672" y="306" font-size="12" fill="#1f2328">terminates the app's Firestore</text>
  <text x="672" y="322" font-size="12" fill="#1f2328">instances and frees its name</text>
  <path d="M770,262 L770,222" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>
  <text x="778" y="246" font-size="11" fill="#57606a">onDeleteApp</text>
</svg>
