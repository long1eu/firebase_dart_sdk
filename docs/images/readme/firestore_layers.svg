<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Inside cloud_firestore_dart</title>
  <desc id="desc">Layers of the main library, top to bottom: the public API; the client, which runs every call in order on one serial queue and holds the event manager for listeners and the sync engine; then, side by side, the local store (the cache, in memory or in SQLite through the opener you pass) and the remote store (the listen and write streams and the one-shot calls); then the transport, gRPC on the Dart VM and in Flutter or REST and WebChannel in the browser; then Cloud Firestore or the emulator. A write is applied to the local store at once and sent by the remote store; changes from the backend come back up to listeners. Firestore Lite, a separate library, skips the cache and the streams and sends one request per call.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="600" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Main library -->
  <text x="20" y="30" font-size="13" font-weight="600" fill="#57606a">package:cloud_firestore_dart/cloud_firestore_dart.dart</text>

  <rect x="20" y="42" width="660" height="56" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="350" y="65" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Public API</text>
  <text x="350" y="85" font-size="12" fill="#1f2328" text-anchor="middle">Firestore, references, queries, snapshots, WriteBatch, Transaction, converters</text>

  <line x1="350" y1="98" x2="350" y2="118" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="20" y="122" width="660" height="104" rx="8" fill="#f6f8fa" stroke="#1f2328"/>
  <text x="350" y="144" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Client: every call runs in order on one serial queue</text>
  <rect x="36" y="156" width="300" height="56" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="186" y="178" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Event manager and views</text>
  <text x="186" y="197" font-size="12" fill="#57606a" text-anchor="middle">one view per query, shared by its listeners</text>
  <rect x="364" y="156" width="300" height="56" rx="6" fill="#ffffff" stroke="#57606a"/>
  <text x="514" y="178" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Sync engine</text>
  <text x="514" y="197" font-size="12" fill="#57606a" text-anchor="middle">writes, listens, transactions, bundles</text>

  <g stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="320" y1="226" x2="320" y2="250"/>
    <line x1="380" y1="226" x2="380" y2="250"/>
  </g>

  <rect x="20" y="254" width="320" height="150" rx="8" fill="#ffffff" stroke="#1f2328"/>
  <text x="180" y="276" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Local store: the cache</text>
  <g font-size="12" fill="#1f2328">
    <text x="34" y="298">documents, pending writes, queries, bundles</text>
    <text x="34" y="316">writes are applied here at once</text>
    <text x="34" y="334">queries: cache index, previous result or scan</text>
  </g>
  <rect x="34" y="346" width="120" height="44" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="94" y="365" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">memory</text>
  <text x="94" y="381" font-size="11" fill="#57606a" text-anchor="middle">the default</text>
  <rect x="164" y="346" width="162" height="44" rx="6" fill="#f6f8fa" stroke="#57606a"/>
  <text x="245" y="365" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">SQLite</text>
  <text x="245" y="381" font-size="11" fill="#57606a" text-anchor="middle">through your opener</text>

  <rect x="360" y="254" width="320" height="150" rx="8" fill="#ffffff" stroke="#1f2328"/>
  <text x="520" y="276" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Network: remote store, datastore</text>
  <g font-size="12" fill="#1f2328">
    <text x="374" y="298">listen stream: changes to the queries</text>
    <text x="374" y="316">that have listeners</text>
    <text x="374" y="334">write stream: pending writes, in order</text>
    <text x="374" y="352">one-shot calls: transactions, aggregations</text>
    <text x="374" y="376" fill="#57606a">reconnects with backoff; resumes</text>
    <text x="374" y="392" fill="#57606a">listens with a resume token</text>
  </g>

  <g stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="410" y1="404" x2="410" y2="428"/>
    <line x1="620" y1="404" x2="620" y2="428"/>
  </g>

  <!-- Transport -->
  <rect x="200" y="432" width="236" height="56" rx="8" fill="#ffffff" stroke="#1f2328"/>
  <text x="318" y="455" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">gRPC over HTTP/2</text>
  <text x="318" y="474" font-size="12" fill="#57606a" text-anchor="middle">Dart VM and Flutter</text>
  <rect x="456" y="432" width="236" height="56" rx="8" fill="#ffffff" stroke="#1f2328" stroke-dasharray="5 3"/>
  <text x="574" y="455" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">REST and WebChannel</text>
  <text x="574" y="474" font-size="12" fill="#57606a" text-anchor="middle">browser, experimental</text>
  <text x="186" y="455" font-size="12" font-weight="600" fill="#57606a" text-anchor="end">transport</text>
  <text x="186" y="472" font-size="11" fill="#57606a" text-anchor="end">picked by the platform</text>

  <g stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <line x1="318" y1="488" x2="318" y2="522"/>
    <line x1="574" y1="488" x2="574" y2="522"/>
  </g>
  <rect x="200" y="526" width="680" height="54" rx="8" fill="#f6f8fa" stroke="#1f2328"/>
  <text x="540" y="551" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Cloud Firestore or the Firestore emulator</text>
  <text x="540" y="569" font-size="12" fill="#57606a" text-anchor="middle">Standard or Enterprise edition</text>

  <!-- Lite -->
  <rect x="704" y="42" width="176" height="362" rx="8" fill="#ffffff" stroke="#57606a" stroke-dasharray="5 3"/>
  <text x="792" y="66" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">Firestore Lite</text>
  <text x="792" y="84" font-size="11" fill="#57606a" text-anchor="middle">lite.dart, experimental</text>
  <g font-size="12" fill="#1f2328">
    <text x="716" y="114">reads, writes, batches,</text>
    <text x="716" y="130">transactions, queries,</text>
    <text x="716" y="146">aggregations</text>
    <text x="716" y="176">no cache, no listeners,</text>
    <text x="716" y="192">no sync engine:</text>
    <text x="716" y="208">one request per call</text>
    <text x="716" y="238">gRPC on the VM,</text>
    <text x="716" y="254">REST only in the browser</text>
  </g>
  <path d="M792,404 L792,522" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <text x="20" y="524" font-size="11" fill="#57606a">Dashed outline:</text>
  <text x="20" y="540" font-size="11" fill="#57606a">experimental.</text>
</svg>
