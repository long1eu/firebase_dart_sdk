<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title id="title">Which layers of the client each test suite runs, and against what</title>
  <desc id="desc">Spec tests and the view property tests run the EventManager, the SyncEngine, the LocalStore and the
RemoteStore for real, with a MockDatastore in place of the Datastore and transport, and scripted or random backend
messages. The integration suites over gRPC and over WebChannel, the chaos and soak tests, the Enterprise suite, the
browser tests and the production verification kit run the whole client from the public API to the transport. They run
against the Standard edition emulator, a TCP proxy in front of it, the Enterprise edition emulator, the emulator from
Chrome, and a real Firestore database or the emulator respectively.</desc>
  <rect x="0" y="0" width="1020" height="500" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#111827">What each suite runs, and against what</text>
  <text x="24" y="56" font-size="13" fill="#4b5563">A solid bar is the code of the SDK, run for real. A dashed box is a fake in its place. The last column is the other end.</text>

  <!-- Column headers -->
  <g font-size="12" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="326" y="92">Public API</text>
    <text x="438" y="86">EventManager,</text>
    <text x="438" y="102">SyncEngine</text>
    <text x="550" y="86">LocalStore and</text>
    <text x="550" y="102">persistence</text>
    <text x="662" y="92">RemoteStore</text>
    <text x="774" y="86">Datastore and</text>
    <text x="774" y="102">transport</text>
    <text x="915" y="92">Runs against</text>
  </g>
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="24" y1="114" x2="1000" y2="114"/>
    <line x1="270" y1="70" x2="270" y2="474"/>
    <line x1="382" y1="70" x2="382" y2="474"/>
    <line x1="494" y1="70" x2="494" y2="474"/>
    <line x1="606" y1="70" x2="606" y2="474"/>
    <line x1="718" y1="70" x2="718" y2="474"/>
    <line x1="830" y1="70" x2="830" y2="474"/>
  </g>

  <!-- Row labels -->
  <g font-size="13" fill="#111827">
    <text x="24" y="143">Spec tests (JSON shared</text>
    <text x="24" y="159" font-size="11" fill="#4b5563">with the JS and Android SDKs)</text>
    <text x="24" y="193">View property tests</text>
    <text x="24" y="209" font-size="11" fill="#4b5563">held_back_view, view_listeners</text>
    <text x="24" y="250">Integration over gRPC</text>
    <text x="24" y="300">Integration over WebChannel</text>
    <text x="24" y="316" font-size="11" fill="#4b5563">on the Dart VM, also long polling</text>
    <text x="24" y="350">Chaos and soak tests</text>
    <text x="24" y="400">Enterprise suite</text>
    <text x="24" y="443">Browser tests (Chrome)</text>
    <text x="24" y="459" font-size="11" fill="#4b5563">dart2js and dart2wasm</text>
  </g>

  <!-- Bars: real code -->
  <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.2">
    <rect x="386" y="128" width="328" height="34" rx="5"/>
    <rect x="386" y="178" width="328" height="34" rx="5"/>
    <rect x="274" y="228" width="552" height="34" rx="5"/>
    <rect x="274" y="278" width="552" height="34" rx="5"/>
    <rect x="274" y="328" width="552" height="34" rx="5"/>
    <rect x="274" y="378" width="552" height="34" rx="5"/>
    <rect x="274" y="428" width="552" height="34" rx="5"/>
  </g>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <text x="550" y="150">memory and SQLite persistence</text>
    <text x="550" y="200">memory and SQLite persistence</text>
    <text x="550" y="250">the whole client, gRPC transport</text>
    <text x="550" y="300">the whole client, web transport (REST and WebChannel)</text>
    <text x="550" y="350">the whole client, over each of the transports</text>
    <text x="550" y="400">the whole client</text>
    <text x="550" y="450">the whole client compiled for the web; cache in IndexedDB or OPFS</text>
  </g>

  <!-- Fakes -->
  <g fill="#ffffff" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="5 3">
    <rect x="722" y="128" width="104" height="34" rx="5"/>
    <rect x="722" y="178" width="104" height="34" rx="5"/>
  </g>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <text x="774" y="150">MockDatastore</text>
    <text x="774" y="200">MockDatastore</text>
  </g>

  <!-- Other end -->
  <g fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2">
    <rect x="834" y="128" width="166" height="34" rx="5"/>
    <rect x="834" y="178" width="166" height="34" rx="5"/>
    <rect x="834" y="228" width="166" height="34" rx="5"/>
    <rect x="834" y="278" width="166" height="34" rx="5"/>
    <rect x="834" y="328" width="166" height="34" rx="5"/>
    <rect x="834" y="378" width="166" height="34" rx="5"/>
    <rect x="834" y="428" width="166" height="34" rx="5"/>
  </g>
  <g font-size="11" fill="#111827" text-anchor="middle">
    <text x="917" y="142">scripted watch and</text>
    <text x="917" y="156">write messages</text>
    <text x="917" y="192">seeded random backend</text>
    <text x="917" y="206">events</text>
    <text x="917" y="249">Standard emulator</text>
    <text x="917" y="299">Standard emulator</text>
    <text x="917" y="342">TCP proxy that cuts and</text>
    <text x="917" y="356">stalls, then the emulator</text>
    <text x="917" y="399">Enterprise emulator</text>
    <text x="917" y="449">Standard emulator</text>
  </g>

  <text x="24" y="492" font-size="12" fill="#374151">Not shown: the production verification kit (the whole client against a real database, opt-in), unit tests of single classes, and fuzz tests of the parsers.</text>
</svg>
