<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 740" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Main library compared with Firestore Lite</title>
<desc id="d">Two stacks of layers. The main library has eight layers from the public API down to the transport: client and serial queue, event manager and views, sync engine, local store and persistence, remote store, datastore with streams and unary calls, and a transport of gRPC on the VM or REST and WebChannel on the web. Firestore Lite has only the public API, a datastore with unary calls and transactions, and a transport of gRPC on the VM or REST on the web; the five layers in between are not included. Both share the value types, the model and the serializers. The same small web app compiles to 641,418 characters of JavaScript (196,065 gzipped) with the main library and a memory cache, and 415,850 (128,303 gzipped) with Lite.</desc>
<rect x="0" y="0" width="880" height="740" fill="#ffffff"/>
<text x="440" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">What each library contains</text>
<text x="230" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Main library</text>
<text x="230" y="94" text-anchor="middle" font-size="13" fill="#374151">cloud_firestore_dart.dart</text>
<text x="650" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#111827">Firestore Lite</text>
<text x="650" y="94" text-anchor="middle" font-size="13" fill="#374151">lite.dart</text>
<rect x="40" y="110" width="380" height="46" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="54" y="129" font-size="14" font-weight="600" fill="#111827">Public API</text>
<text x="54" y="147" font-size="13" fill="#1f2937">Firestore, references, queries, snapshots</text>
<rect x="460" y="110" width="380" height="46" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="474" y="129" font-size="14" font-weight="600" fill="#111827">Public API</text>
<text x="474" y="147" font-size="13" fill="#1f2937">Firestore, references, queries, snapshots (Lite classes)</text>
<rect x="40" y="166" width="380" height="46" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="54" y="185" font-size="14" font-weight="600" fill="#111827">Client and serial queue</text>
<text x="54" y="203" font-size="13" fill="#1f2937">every operation enters here</text>
<rect x="460" y="166" width="380" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="474" y="195" font-size="14" fill="#4b5563">not included: client and serial queue</text>
<rect x="40" y="222" width="380" height="46" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="54" y="241" font-size="14" font-weight="600" fill="#111827">Event manager and views</text>
<text x="54" y="259" font-size="13" fill="#1f2937">listeners, snapshots, metadata</text>
<rect x="460" y="222" width="380" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="474" y="251" font-size="14" fill="#4b5563">not included: event manager and views</text>
<rect x="40" y="278" width="380" height="46" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="54" y="297" font-size="14" font-weight="600" fill="#111827">Sync engine</text>
<text x="54" y="315" font-size="13" fill="#1f2937">listens, the write queue, limbo resolution</text>
<rect x="460" y="278" width="380" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="474" y="307" font-size="14" fill="#4b5563">not included: sync engine</text>
<rect x="40" y="334" width="380" height="46" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="54" y="353" font-size="14" font-weight="600" fill="#111827">Local store and persistence</text>
<text x="54" y="371" font-size="13" fill="#1f2937">cache in memory or SQLite, query engine</text>
<rect x="460" y="334" width="380" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="474" y="363" font-size="14" fill="#4b5563">not included: local store and persistence</text>
<rect x="40" y="390" width="380" height="46" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="54" y="409" font-size="14" font-weight="600" fill="#111827">Remote store</text>
<text x="54" y="427" font-size="13" fill="#1f2937">keeps the streams in step with the cache</text>
<rect x="460" y="390" width="380" height="46" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="474" y="419" font-size="14" fill="#4b5563">not included: remote store</text>
<rect x="40" y="446" width="380" height="46" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="54" y="465" font-size="14" font-weight="600" fill="#111827">Datastore</text>
<text x="54" y="483" font-size="13" fill="#1f2937">listen and write streams, unary calls</text>
<rect x="460" y="446" width="380" height="46" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="474" y="465" font-size="14" font-weight="600" fill="#111827">Datastore</text>
<text x="474" y="483" font-size="13" fill="#1f2937">unary calls only, transactions</text>
<rect x="40" y="502" width="380" height="46" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="54" y="521" font-size="14" font-weight="600" fill="#111827">Transport</text>
<text x="54" y="539" font-size="13" fill="#1f2937">gRPC on the VM; REST and WebChannel on the web</text>
<rect x="460" y="502" width="380" height="46" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/>
<text x="474" y="521" font-size="14" font-weight="600" fill="#111827">Transport</text>
<text x="474" y="539" font-size="13" fill="#1f2937">gRPC on the VM; REST on the web</text>
<rect x="40" y="614" width="800" height="40" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="440" y="639" text-anchor="middle" font-size="14" fill="#111827">Shared by both: value types (Timestamp, FieldValue, Filter, ...), the model, the serializers, FirestoreError</text>
<rect x="40" y="558" width="800" height="40" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.5"/>
<text x="440" y="583" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Cloud Firestore or the emulator</text>
<text x="40" y="678" font-size="13" font-weight="600" fill="#111827">Same small web app, dart compile js -O2 (from the Size section):</text>
<text x="40" y="700" font-size="13" fill="#1f2937">641,418 characters, 196,065 gzipped</text>
<text x="460" y="700" font-size="13" fill="#1f2937">415,850 characters, 128,303 gzipped</text>
</svg>
