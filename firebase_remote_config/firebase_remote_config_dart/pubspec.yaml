name: firebase_remote_config_dart
description: >-
  Firebase Remote Config for pure Dart: fetch, activate and realtime updates on
  the VM and the web.
version: 0.1.0
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/firebase_remote_config/firebase_remote_config_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - remote-config

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  collection: ^1.18.0
  # Local development resolves this from ../../firebase_core/firebase_app_dart
  # through pubspec_overrides.yaml (not published).
  firebase_app_dart: ^0.2.0
  # Resolved from ../../firebase_installations/firebase_installations_dart
  # through pubspec_overrides.yaml (not published).
  firebase_installations_dart: ^0.1.0
  # 1.6.0: AbortableRequest, and BrowserClient streams response bodies.
  http: ^1.6.0
  meta: ^1.11.0
  web: ^1.1.0

dev_dependencies:
  args: ^2.5.0
  fake_async: ^1.3.0
  lints: ^6.1.0
  rxdart: ^0.28.0
  test: ^1.25.0
