name: cloud_firestore_vm
description: Dart implementation of Cloud Firestore SDK with live synchronization and offline support.
repository: https://github.com/long1eu/firebase_dart_sdk
version: 0.0.7
environment:
  sdk: ^3.0.0

dependencies:
  _firebase_database_collection_vm:
    path: ../../firebase_core/_firebase_database_collection_vm
  _firebase_internal_vm:
    path: ../../firebase_core/_firebase_internal_vm
  firebase_core_vm:
    path: ../../firebase_core/firebase_core_vm
  protobuf: ^3.1.0
  grpc: ^4.0.0
  http2: ^2.2.0
  rxdart: ^0.28.0
  semaphore: ^1.0.1
  path: ^1.9.0
  fixnum: ^1.1.0
  meta: ^1.11.0
  collection: ^1.18.0
  async: ^2.11.0
  crypto: ^3.0.3

dev_dependencies:
  test: ^1.25.0
  mockito: ^5.4.0
  uuid: ^4.0.0
  sqlite3: ^2.4.0

# firebase-android-sdk commit this port last synced to (2019-07-23, "Only retry transactions on non-permanent errors (#628)")
latest_commit: 576da00e85e3950bd53049f800a552f28a0c6d99
