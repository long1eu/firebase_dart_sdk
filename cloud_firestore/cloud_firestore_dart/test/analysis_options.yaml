include: ../../../analysis_options.yaml

linter:
  rules:
    discarded_futures: true
    unawaited_futures: true
    # Locals such as `_query` or `_key` keep their underscore so that they do not shadow the
    # helpers of test/util/test_util.dart (`query()`, `key()`) that build them.
    no_leading_underscores_for_local_identifiers: false
