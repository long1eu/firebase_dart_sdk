name: cloud_firestore_dart
description: >-
  Unofficial pure-Dart Cloud Firestore client ported from the Firebase Android
  SDK: offline cache in SQLite, real-time listeners, queries and transactions.
version: 0.1.0
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/cloud_firestore/cloud_firestore_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - firestore
  - database
  - offline

# The VM uses native gRPC over HTTP/2 (dart:io). The web uses REST and
# WebChannel over fetch, with a memory cache only; it is experimental.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  async: ^2.11.0
  collection: ^1.18.0
  crypto: ^3.0.3
  # Local development resolves this from ../../firebase_core/firebase_app_dart
  # through pubspec_overrides.yaml (not published).
  firebase_app_dart: ^0.1.0
  fixnum: ^1.1.0
  grpc: ^5.1.0
  # grpc 5.2 requires http2 ^2.3.1; move to 3.x together with grpc (the keepalive transport
  # implements ClientTransportConnection, which gains a member in 3.1).
  http2: ^2.3.1
  meta: ^1.11.0
  path: ^1.9.0
  protobuf: ^6.1.0
  rxdart: ^0.28.0
  semaphore: ^1.0.1
  web: ^1.1.0

dev_dependencies:
  # Only for test/integration_auth. Local development resolves it from
  # ../../firebase_auth/firebase_auth_providers_dart through pubspec_overrides.yaml.
  firebase_auth_providers_dart: ^0.1.0
  mockito: ^5.4.0
  sqlite3: ^2.4.0
  test: ^1.25.0
  uuid: ^4.0.0
