name: cloud_firestore_dart
description: >-
  Unofficial pure-Dart Cloud Firestore client ported from the Firebase Android
  SDK: offline cache in SQLite, real-time listeners, queries and transactions.
version: 0.3.1
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/cloud_firestore/cloud_firestore_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - firestore
  - database
  - offline
  - server

# The VM uses native gRPC over HTTP/2 (dart:io). The web uses REST and
# WebChannel over fetch, with a memory cache or an opt-in SQLite cache in
# IndexedDB; it is supported in Chrome and untested in other browsers.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  async: ^2.11.0
  collection: ^1.18.0
  crypto: ^3.0.3
  # Local development resolves this from ../../firebase_core/firebase_app_dart
  # through pubspec_overrides.yaml (not published).
  firebase_app_dart: ^0.2.0
  fixnum: ^1.1.0
  grpc: ^5.1.0
  # grpc 5.2 requires http2 ^2.3.1; move to 3.x together with grpc (the keepalive transport
  # implements ClientTransportConnection, which gains a member in 3.1).
  http2: ^2.3.1
  meta: ^1.11.0
  path: ^1.9.0
  protobuf: ^6.1.0
  rxdart: ^0.28.0
  semaphore: ^1.0.1
  web: ^1.1.0

dev_dependencies:
  # The SQLite opener of the examples, of the tests that open a real cache
  # (test/readme, the browser tests, their workers) and of the benchmarks. Local
  # development resolves it from ../cloud_firestore_dart_sqlite through
  # pubspec_overrides.yaml.
  cloud_firestore_dart_sqlite: ^0.1.0
  # Virtual time for the tests of timers and backoffs.
  fake_async: ^1.3.0
  # Only for test/integration_auth. Local development resolves it from
  # ../../firebase_auth/firebase_auth_providers_dart through pubspec_overrides.yaml.
  firebase_auth_providers_dart: ^0.2.0
  lints: ^6.1.0
  mockito: ^5.4.0
  # The tests use SQLite directly too (package:sqlite3/sqlite3.dart and wasm.dart). The same range as
  # cloud_firestore_dart_sqlite, and the code compiles with both majors (no package:sqlite3/open.dart).
  # pubspec.lock has 3.9.1; the browser tests run on the sqlite3.wasm whose checksum
  # tool/build_web_test_assets.sh pins for the locked version. Dart 3.8 and 3.9 resolve 2.x (3.x
  # needs Dart 3.10), so the CI job on the lowest SDK tests that major.
  sqlite3: '>=2.7.3 <4.0.0'
  test: ^1.25.0
  uuid: ^4.0.0
