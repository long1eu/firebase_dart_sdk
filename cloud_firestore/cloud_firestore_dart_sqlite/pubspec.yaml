name: cloud_firestore_dart_sqlite
description: >-
  The SQLite offline cache of cloud_firestore_dart on the Dart VM, in Flutter
  and in the browser (WebAssembly on IndexedDB or OPFS), on top of package:sqlite3.
version: 0.1.1
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/cloud_firestore/cloud_firestore_dart_sqlite
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - firestore
  - sqlite
  - offline

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

executables:
  # dart run cloud_firestore_dart_sqlite:setup_web [web directory]
  setup_web:

dependencies:
  # The 0.2 API (FirebaseFirestore, Settings, FirestoreException). Local
  # development resolves these two from the sibling checkouts through
  # pubspec_overrides.yaml (not published).
  cloud_firestore_dart: ^0.2.0
  firebase_app_dart: ^0.2.0
  # 2.7.3 is the first 2.x whose package:sqlite3/wasm.dart is not @experimental
  # and has IndexedDbFileSystem.open(vfsName:). 3.x loads the native library
  # with a build hook (Dart 3.10 or later); pub picks 2.x on older SDKs.
  sqlite3: '>=2.7.3 <4.0.0'
  web: ^1.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
