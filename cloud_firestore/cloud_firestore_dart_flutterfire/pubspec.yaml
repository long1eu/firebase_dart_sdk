name: cloud_firestore_dart_flutterfire
description: >-
  Unofficial bridge from FlutterFire (firebase_core, firebase_auth) to
  cloud_firestore_dart: the pure-Dart Firestore client uses the FlutterFire
  app options and signed-in user.
version: 0.1.2
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/cloud_firestore/cloud_firestore_dart_flutterfire
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - firestore
  - flutterfire
  - authentication

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  # Local development resolves these from the sibling packages through
  # pubspec_overrides.yaml (not published).
  cloud_firestore_dart: '>=0.2.0 <0.4.0'
  firebase_app_dart: ^0.2.0
  firebase_auth: '>=5.0.0 <8.0.0'
  firebase_core: '>=3.0.0 <6.0.0'
  flutter:
    sdk: flutter
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
