name: firebase_database_dart
description: >-
  Unofficial pure-Dart client of the Firebase Realtime Database. Work in
  progress: tested against the emulator only.
version: 0.1.0
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/firebase_database/firebase_database_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - database
  - dart

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  collection: ^1.18.0
  # SHA-1 of node hashes and compound hashes.
  crypto: ^3.0.3
  # Local development resolves this from ../../firebase_core/firebase_app_dart
  # through pubspec_overrides.yaml (not published).
  firebase_app_dart: ^0.2.0
  meta: ^1.11.0
  web: ^1.1.0

dev_dependencies:
  # The production verification kit (test/production) parses its command line.
  args: ^2.5.0
  # Controlled time in unit tests, as cloud_firestore_dart.
  fake_async: ^1.3.0
  # The production verification kit signs a throwaway user in. Resolved from
  # ../../firebase_auth/firebase_auth_providers_dart through pubspec_overrides.yaml.
  firebase_auth_providers_dart: ^0.4.0
  # The production verification kit restarts a client on the SQLite cache (check 38). Resolved
  # from ../firebase_database_dart_sqlite through pubspec_overrides.yaml; it depends on this
  # package, which pub allows for a dev dependency.
  firebase_database_dart_sqlite: ^0.1.0
  # The emulator tests' owner writes and reads over REST (test/integration/emulator_rig.dart);
  # 1.5.0 is the version firebase_storage_dart uses.
  http: ^1.5.0
  lints: ^6.1.0
  test: ^1.25.0
