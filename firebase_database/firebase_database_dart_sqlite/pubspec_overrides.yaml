# Local development only: use the sibling checkouts instead of the hosted
# packages. Excluded from the published archive by .pubignore.
dependency_overrides:
  # The next three only for the README snippets (firebase_auth_providers_dart and what it needs).
  cloud_firestore_dart:
    path: ../../cloud_firestore/cloud_firestore_dart
  firebase_auth_providers_dart:
    path: ../../firebase_auth/firebase_auth_providers_dart
  secure_flow:
    path: ../../secure_flow/secure_flow
  firebase_app_dart:
    path: ../../firebase_core/firebase_app_dart
  firebase_database_dart:
    path: ../firebase_database_dart
