name: firebase_app_check_dart
description: >-
  Firebase App Check for pure Dart: debug and custom providers, token caching
  and refresh, on the VM and the web.
version: 0.1.0
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/firebase_app_check/firebase_app_check_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - app-check
  - security

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  firebase_app_dart: ^0.2.3
  firebase_installations_dart: ^0.1.0
  _firebase_transport_dart: ^0.1.0
  http: ^1.6.0
  meta: ^1.11.0

dev_dependencies:
  args: ^2.5.0
  fake_async: ^1.3.0
  lints: ^6.1.0
  test: ^1.25.0
  web: ^1.1.0
