name: firebase_analytics_dart
description: >-
  Unofficial pure-Dart client of Google Analytics for Firebase over the GA4
  Measurement Protocol, for desktop apps, command-line tools and servers.
version: 0.1.0-dev.1
publish_to: none
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/firebase_analytics/firebase_analytics_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - analytics
  - dart

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  # Local development resolves this from ../../firebase_core/firebase_app_dart
  # through pubspec_overrides.yaml (not published).
  firebase_app_dart: ^0.2.0
  http: ^1.5.0
  meta: ^1.11.0

dev_dependencies:
  fake_async: ^1.3.0
  lints: ^6.1.0
  test: ^1.25.0
