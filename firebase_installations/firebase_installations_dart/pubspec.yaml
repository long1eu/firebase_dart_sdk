name: firebase_installations_dart
description: >-
  Firebase Installations for pure Dart: installation ids and auth tokens on
  the VM and the web.
version: 0.1.0
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/firebase_installations/firebase_installations_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - installations

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  # SHA-256 of the store keys (file names of FileKeyValueStore).
  crypto: ^3.0.3
  # Local development resolves this from ../../firebase_core/firebase_app_dart
  # through pubspec_overrides.yaml (not published).
  firebase_app_dart: ^0.2.0
  http: ^1.6.0
  meta: ^1.11.0
  # IndexedDbKeyValueStore (lib/web.dart).
  web: ^1.1.0

dev_dependencies:
  # The examples parse their command line.
  args: ^2.5.0
  fake_async: ^1.3.0
  lints: ^6.1.0
  test: ^1.25.0
