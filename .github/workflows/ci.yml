# NOTE: this workflow has not been run yet (written without access to GitHub Actions).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dart-lang/setup-dart@v1.7.1
        with:
          sdk: stable
      - name: Analyze and run unit tests
        run: ./tool/test_all.sh

  # Optional job. The emulator suite has 1-2 known flaky tests (event ordering in the
  # emulator, e.g. write_batch_test testWriteTheSameServerTimestampAcrossWrites).
  # `continue-on-error: true` keeps this job from failing the workflow, but the job still
  # shows as failed in the UI and the full test output is uploaded, so failures stay visible.
  # Do not rely on this job to gate merges until the flaky tests are fixed.
  integration:
    name: Emulator integration tests (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dart-lang/setup-dart@v1.7.1
        with:
          sdk: stable
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Start Firestore emulator
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          firebase emulators:start --only firestore --project demo-test \
            --config firebase.json > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then echo "emulator up"; exit 0; fi
            sleep 1
          done
          echo "emulator did not start"; cat "$RUNNER_TEMP/emulator.log"; exit 1
      - name: Run integration tests
        working-directory: cloud_firestore/cloud_firestore_dart
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          dart pub get
          dart test test/integration 2>&1 | tee "$RUNNER_TEMP/integration.log"
          exit "${PIPESTATUS[0]}"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: integration-log
          path: ${{ runner.temp }}/*.log
