# NOTE: this workflow has not been run yet (written without access to GitHub Actions).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (all packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dart-lang/setup-dart@v1.7.1
        with:
          sdk: stable
      - name: Analyze and run unit tests
        run: ./tool/test_all.sh
      # After test_all.sh, which runs `dart pub get`: the formatter takes the language version
      # (and so the style) from the resolved package. Generated protos are included; the
      # plugin and tool/gen_protos.sh emit formatted code.
      - name: Check formatting (firebase_app_dart)
        working-directory: firebase_core/firebase_app_dart
        run: dart format --output=none --set-exit-if-changed lib
      - name: Check formatting (cloud_firestore_dart)
        working-directory: cloud_firestore/cloud_firestore_dart
        run: dart format --output=none --set-exit-if-changed lib

  # The emulator suite has 1-2 known flaky tests (event ordering in the emulator, e.g.
  # write_batch_test testWriteTheSameServerTimestampAcrossWrites).
  # `continue-on-error: true` keeps this job from failing the workflow, but the job still
  # shows as failed in the UI and the full test output is uploaded, so failures stay visible.
  # Do not rely on this job to gate merges until the flaky tests are fixed.
  integration:
    name: Standard emulator integration tests (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dart-lang/setup-dart@v1.7.1
        with:
          sdk: stable
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Start Firestore emulator
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          firebase emulators:start --only firestore --project demo-test \
            --config firebase.json > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then echo "emulator up"; exit 0; fi
            sleep 1
          done
          echo "emulator did not start"; cat "$RUNNER_TEMP/emulator.log"; exit 1
      - name: Install the JS interop harness
        # js_interop_test.dart is skipped (with a reason) without tool/interop/node_modules.
        working-directory: tool/interop
        run: npm ci
      - name: Run integration tests
        env:
          TEST_LOG_DIR: ${{ runner.temp }}
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          ./tool/test_integration.sh standard
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: integration-log
          path: ${{ runner.temp }}/*.log

  # The same standard suite over the web transport (REST and WebChannel instead of gRPC),
  # still on the VM: tool/test_integration.sh --transport=webchannel. Allowed to fail for the
  # same reason as the job above.
  integration-webchannel:
    name: Standard emulator integration tests over the web transport (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dart-lang/setup-dart@v1.7.1
        with:
          sdk: stable
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Start Firestore emulator
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          firebase emulators:start --only firestore --project demo-test \
            --config firebase.json > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then echo "emulator up"; exit 0; fi
            sleep 1
          done
          echo "emulator did not start"; cat "$RUNNER_TEMP/emulator.log"; exit 1
      - name: Install the JS interop harness
        working-directory: tool/interop
        run: npm ci
      - name: Run integration tests over the web transport
        env:
          TEST_LOG_DIR: ${{ runner.temp }}
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          ./tool/test_integration.sh standard --transport=webchannel
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: integration-webchannel-log
          path: ${{ runner.temp }}/*.log

  # The browser tests (test/browser) in headless Chrome against the emulator, compiled with
  # dart2wasm and with dart2js. They are the only tests that run the client in a browser.
  # Allowed to fail: web support is experimental.
  browser:
    name: Browser tests in Chrome (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dart-lang/setup-dart@v1.7.1
        with:
          sdk: stable
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Start Firestore emulator
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          firebase emulators:start --only firestore --project demo-test \
            --config firebase.json > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then echo "emulator up"; exit 0; fi
            sleep 1
          done
          echo "emulator did not start"; cat "$RUNNER_TEMP/emulator.log"; exit 1
      - name: Run browser tests (dart2wasm)
        # Chrome is preinstalled on the ubuntu-latest image.
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          dart pub get
          dart test -p chrome -c dart2wasm test/browser 2>&1 | tee "$RUNNER_TEMP/browser_dart2wasm.log"
          exit "${PIPESTATUS[0]}"
      - name: Run browser tests (dart2js)
        if: always()
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          dart test -p chrome -c dart2js test/browser 2>&1 | tee "$RUNNER_TEMP/browser_dart2js.log"
          exit "${PIPESTATUS[0]}"
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: browser-log
          path: ${{ runner.temp }}/*.log

  # Tests that need the Enterprise edition of Firestore (test/integration_enterprise). They run
  # against a second emulator started from the emulator JAR with `--database-edition enterprise`
  # on port 8181 (tool/start_enterprise_emulator.sh); the standard emulator runs next to it on
  # 8080 for the tests that compare the two. Allowed to fail for the same reason as the job
  # above, and because Enterprise support in the emulator is recent.
  enterprise:
    name: Enterprise emulator tests (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1.7.1
        with:
          sdk: stable
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Download the Firestore emulator JAR
        # Puts cloud-firestore-emulator-v*.jar in ~/.cache/firebase/emulators.
        run: firebase setup:emulators:firestore
      - name: Start standard Firestore emulator
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          mkdir -p "$EMULATOR_DIR"
          firebase emulators:start --only firestore --project demo-test \
            --config firebase.json > "$EMULATOR_DIR/emulator.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then echo "emulator up"; exit 0; fi
            sleep 1
          done
          echo "emulator did not start"; cat "$EMULATOR_DIR/emulator.log"; exit 1
      - name: Start Enterprise Firestore emulator
        run: ./tool/start_enterprise_emulator.sh
      - name: Run enterprise tests
        working-directory: cloud_firestore/cloud_firestore_dart
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIRESTORE_ENTERPRISE_EMULATOR_HOST: 127.0.0.1:8181
        run: |
          dart pub get
          dart test test/integration_enterprise 2>&1 | tee "$EMULATOR_DIR/enterprise.log"
          exit "${PIPESTATUS[0]}"
      - name: Stop Enterprise Firestore emulator
        if: always()
        run: ./tool/stop_enterprise_emulator.sh
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: enterprise-log
          path: ${{ runner.temp }}/emulator/*.log

  # The standard integration suite (test/integration) against the Enterprise edition emulator:
  # shows whether the client behaves the same on both editions. The tests whose expectations
  # only hold for the Standard edition are skipped with a reason (see the "Enterprise edition"
  # section of the package README). Allowed to fail, like the jobs above.
  standard-suite-on-enterprise:
    name: Standard suite on the Enterprise emulator (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1.7.1
        with:
          sdk: stable
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Download the Firestore emulator JAR
        # Puts cloud-firestore-emulator-v*.jar in ~/.cache/firebase/emulators.
        run: firebase setup:emulators:firestore
      - name: Start Enterprise Firestore emulator
        run: ./tool/start_enterprise_emulator.sh
      - name: Run the standard suite against the Enterprise emulator
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          TEST_LOG_DIR="$EMULATOR_DIR" ./tool/test_integration.sh enterprise test/integration
      - name: Stop Enterprise Firestore emulator
        if: always()
        run: ./tool/stop_enterprise_emulator.sh
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: standard-suite-on-enterprise-log
          path: ${{ runner.temp }}/emulator/*.log
