name: CI

# The checks of every pull request and of every push to main. The slow and opt-in suites (the
# browser tests on both compilers, the Auth emulator tests, the soak and the long property runs,
# the unit suite in a Linux amd64 container) run every night in nightly.yml, and on demand from
# its "Run workflow" button. The browser tests also run here, on dart2wasm only, when a change
# touches what they cover. tool/README.md ("CI") describes the jobs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request (or a branch run by hand) cancels the run it supersedes. Runs on
# main are never cancelled: each commit of main keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job names its runner image instead of ubuntu-latest: the jobs use what the image ships
# (Chrome, libsqlite3, openssl), so a new image must be a deliberate change. ubuntu-26.04 is
# the image ubuntu-latest resolved to in every run so far, the only one the jobs were seen
# green on.
#
# Order: `changes` and the two unit jobs start at once. The emulator suites wait for the unit job
# on the lowest SDK (analyze, unit tests, formatting) and are skipped when a change touches only
# documentation, which the emulator suites cannot see (the unit jobs still run: they check the
# snippets of the READMEs). A skipped job counts as passed for a required check.
#
# Actions are pinned by commit; the comment names the release. Dependabot (dependabot.yml) keeps
# them current.
jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The file list of a pull request comes from the API.
      pull-requests: read
    outputs:
      # A run started by hand runs everything.
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
      # Whether the change touches what the browser tests cover.
      browser: ${{ github.event_name == 'workflow_dispatch' || steps.browser.outputs.browser == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          # `code` is true unless every changed file is documentation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!**/LICENSE'
              - '!**/NOTICE'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: browser
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          # `browser` is true when any changed file is one of these: the library, the example
          # (the web openers the tests use), the browser tests, and what runs them.
          filters: |
            browser:
              - 'cloud_firestore/cloud_firestore_dart/lib/**'
              - 'cloud_firestore/cloud_firestore_dart/example/**'
              - 'cloud_firestore/cloud_firestore_dart/test/browser/**'
              - 'cloud_firestore/cloud_firestore_dart/pubspec.yaml'
              - 'tool/test_browser.sh'
              - 'tool/build_web_test_assets.sh'
              - 'tool/start_private_emulator.sh'
              - 'tool/stop_private_emulator.sh'
              - 'tool/print_test_failures.sh'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  # The lowest supported SDK (the `sdk: ^3.8.0` floor of cloud_firestore_dart). The formatting
  # check runs only here, on a pinned SDK, so that a formatter change in a new Dart release
  # cannot fail CI without a code change. `lib` is formatted identically by 3.8.0 and by the
  # SDK it was last formatted with (3.12.2); when the pin moves, reformat with the new one.
  unit:
    name: Unit tests and formatting (Dart 3.8.0)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dart
        with:
          sdk: 3.8.0
      - name: Analyze and run unit tests
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/unit
        run: ./tool/test_all.sh
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-log
          path: ${{ runner.temp }}/unit/*
      # After test_all.sh, which runs `dart pub get`: the formatter takes the language version
      # (and so the style) from the resolved package. Generated protos are included; the
      # plugin and tool/gen_protos.sh emit formatted code.
      - name: Check formatting (firebase_app_dart)
        # Also when a test failed: test_all.sh has run `dart pub get` by then.
        if: ${{ !cancelled() }}
        working-directory: firebase_core/firebase_app_dart
        run: dart format --output=none --set-exit-if-changed lib example
      - name: Check formatting (cloud_firestore_dart)
        if: ${{ !cancelled() }}
        working-directory: cloud_firestore/cloud_firestore_dart
        run: dart format --output=none --set-exit-if-changed lib example
      - name: Check formatting (firebase_auth_providers_dart)
        if: ${{ !cancelled() }}
        working-directory: firebase_auth/firebase_auth_providers_dart
        run: dart format --output=none --set-exit-if-changed lib example
      - name: Lowest versions of the dependencies (firebase_auth_providers_dart)
        # The package claims `googleapis_auth: ^2.0.0`, `http: ^1.2.0` and `crypto: ^3.0.3`: run its
        # tests with the lowest versions this SDK resolves (only the runtime dependencies are
        # downgraded: the lowest versions of the test tooling do not compile on 3.8).
        if: ${{ !cancelled() }}
        working-directory: firebase_auth/firebase_auth_providers_dart
        run: |
          dart pub downgrade googleapis_auth crypto http meta
          dart pub deps --style=compact | grep -E '^- (googleapis_auth|crypto|http) '
          dart analyze --fatal-warnings lib test
          dart test --reporter expanded

  # The same on the current stable SDK, without the formatting check.
  unit-stable:
    name: Unit tests (Dart stable)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - name: Analyze and run unit tests
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/unit
        run: ./tool/test_all.sh
      # The connectivity detector against a real change of the network interfaces: the test adds a dummy interface
      # with `ip`, so it runs as root (it is skipped, with a reason, everywhere else). Last, because it leaves root
      # owned files in .dart_tool. It passed in a Debian container with CAP_NET_ADMIN (tool/linux/run_in_container.sh)
      # but has not run on a GitHub runner yet: allowed to fail until it did.
      - name: Connectivity detector with a real interface change (root)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          sudo env "PATH=$PATH" FIRESTORE_TEST_NET_ADMIN=1 "$(command -v dart)" test --reporter expanded \
            test/unit/firebase/firestore/remote/connectivity_interface_change_test.dart
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-stable-log
          path: ${{ runner.temp }}/unit/*

  # Required: the suite passed on Linux in Debian containers (arm64, and x64 under emulation;
  # tool/linux/run_in_container.sh) and in five stress runs on macOS, where one test failed once
  # (an HTTP/2 connection error in aggregation_test). transaction_test has failed rarely with an
  # increment counted twice. A failure here is a signal to look at; the full output is uploaded.
  integration:
    name: Standard emulator integration tests
    needs: [changes, unit]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
        with:
          # js_interop_test.dart is skipped (with a reason) without tool/interop/node_modules.
          npm-lockfile: tool/interop/package-lock.json
      - name: Start Firestore emulator
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          firebase emulators:start --only firestore --project demo-test \
            --config firebase.json > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then echo "emulator up"; exit 0; fi
            sleep 1
          done
          echo "emulator did not start"; cat "$RUNNER_TEMP/emulator.log"; exit 1
      - name: Install the JS interop harness
        # firebase-admin and its optional @google-cloud/firestore need Node 22: on an older
        # Node, npm leaves the optional package out and the bundle test cannot load it.
        working-directory: tool/interop
        run: npm ci
      - name: Run integration tests
        env:
          TEST_LOG_DIR: ${{ runner.temp }}
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          ./tool/test_integration.sh standard
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-log
          path: ${{ runner.temp }}/*.log

  # The same standard suite over the web transport (REST and WebChannel instead of gRPC),
  # still on the VM: tool/test_integration.sh --transport=webchannel, then the same with the
  # streams in long polling mode. Against a private emulator started from the JAR on port 8090
  # (tool/start_private_emulator.sh), which is where the web runs go by default. Required, like
  # the job above: both modes passed in a Debian arm64 container.
  integration-webchannel:
    name: Standard emulator integration tests over the web transport
    needs: [changes, unit]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
        with:
          npm-lockfile: tool/interop/package-lock.json
      - name: Start a private Firestore emulator
        run: ./tool/start_private_emulator.sh 8090
      - name: Install the JS interop harness
        working-directory: tool/interop
        run: npm ci
      - name: Run integration tests over the web transport
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          TEST_LOG_DIR="$EMULATOR_DIR" ./tool/test_integration.sh standard --transport=webchannel
      - name: Restart the private Firestore emulator
        # It keeps one thread per WebChannel session for good (tool/README.md).
        if: always()
        run: |
          ./tool/stop_private_emulator.sh 8090
          ./tool/start_private_emulator.sh 8090
      - name: Run integration tests over the web transport with long polling
        if: always()
        run: |
          TEST_LOG_DIR="$EMULATOR_DIR" ./tool/test_integration.sh standard --transport=webchannel-longpolling
      - name: Stop the private Firestore emulator
        if: always()
        run: ./tool/stop_private_emulator.sh 8090
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-webchannel-log
          path: ${{ runner.temp }}/emulator/*.log

  # Tests that need the Enterprise edition of Firestore (test/integration_enterprise). They run
  # against a second emulator started from the emulator JAR with `--database-edition enterprise`
  # on port 8181 (tool/start_enterprise_emulator.sh); the standard emulator runs next to it on
  # 8080 for the tests that compare the two. Required: they passed in a Debian arm64 container.
  enterprise:
    name: Enterprise emulator tests
    needs: [changes, unit]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
      - name: Start standard Firestore emulator
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          mkdir -p "$EMULATOR_DIR"
          firebase emulators:start --only firestore --project demo-test \
            --config firebase.json > "$EMULATOR_DIR/emulator.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then echo "emulator up"; exit 0; fi
            sleep 1
          done
          echo "emulator did not start"; cat "$EMULATOR_DIR/emulator.log"; exit 1
      - name: Start Enterprise Firestore emulator
        run: ./tool/start_enterprise_emulator.sh
      - name: Run enterprise tests
        working-directory: cloud_firestore/cloud_firestore_dart
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIRESTORE_ENTERPRISE_EMULATOR_HOST: 127.0.0.1:8181
        run: |
          dart pub get
          dart test --reporter expanded test/integration_enterprise 2>&1 | tee "$EMULATOR_DIR/enterprise.log"
          exit "${PIPESTATUS[0]}"
      - name: Stop Enterprise Firestore emulator
        if: always()
        run: ./tool/stop_enterprise_emulator.sh
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enterprise-log
          path: ${{ runner.temp }}/emulator/*.log

  # The standard integration suite (test/integration) against the Enterprise edition emulator:
  # shows whether the client behaves the same on both editions. The tests whose expectations
  # only hold for the Standard edition are skipped with a reason (see the "Enterprise edition"
  # section of the package README). Allowed to fail: in a Debian arm64 container under load one
  # chaos test (writes_chaos_test, "lose requests") counted an increment twice once and passed
  # three times on its own; the timing of that test is not yet robust on this emulator.
  standard-suite-on-enterprise:
    name: Standard suite on the Enterprise emulator (allowed to fail)
    needs: [changes, unit]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
      - name: Start Enterprise Firestore emulator
        run: ./tool/start_enterprise_emulator.sh
      - name: Run the standard suite against the Enterprise emulator
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          TEST_LOG_DIR="$EMULATOR_DIR" ./tool/test_integration.sh enterprise test/integration
      - name: Stop Enterprise Firestore emulator
        if: always()
        run: ./tool/stop_enterprise_emulator.sh
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standard-suite-on-enterprise-log
          path: ${{ runner.temp }}/emulator/*.log

  # The browser tests (test/browser) in headless Chrome, compiled with dart2wasm:
  # tool/test_browser.sh, which starts its own emulator on port 8090, fetches or builds what the
  # tests load at run time (tool/build_web_test_assets.sh: sqlite3.wasm, checked against a pinned
  # sha256, and the compiled workers) and runs the test files one after the other. Only when the
  # change touches the library, the example, the browser tests or what runs them. Chrome is
  # preinstalled on the runner image. The nightly runs both compilers (nightly.yml). Required:
  # a regression that only shows in a browser (a page reload, the Web Lock, the storage) is not
  # seen by any other job.
  browser:
    name: Browser tests in Chrome (dart2wasm)
    needs: [changes, unit]
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
      - name: Run browser tests (dart2wasm)
        # The script exits non-zero when a test fails.
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          TEST_LOG_DIR="$EMULATOR_DIR" ./tool/test_browser.sh dart2wasm
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-log
          path: ${{ runner.temp }}/emulator/*.log

  # The size of a program that uses Firestore Lite, and that it does not contain the sync
  # engine, the local store or WebChannel, and the size of the same program on the main library
  # (tool/check_size.sh, budgets in tool/size/check_size.dart). Pinned to the SDK the budgets
  # were measured with: most of the compiled program is the Dart runtime, so the numbers move
  # with the SDK. When the pin moves, measure again and update the budgets and the README.
  # Allowed to fail. Short: it does not wait for the unit job.
  size:
    name: Web size check, lite and full (Dart 3.12.2, allowed to fail)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dart
        with:
          sdk: 3.12.2
      - name: Compile the sample applications and check them against their budgets
        env:
          SIZE_OUT_DIR: ${{ runner.temp }}/size
        run: ./tool/check_size.sh
