name: CI

# The checks of every pull request and of every push to main. The slow and opt-in suites (the
# browser tests on both compilers, the Auth emulator tests, the soak and the long property runs,
# the unit suite in a Linux amd64 container) run every night in nightly.yml, and on demand from
# its "Run workflow" button. The browser tests also run here, on dart2wasm only, when a change
# touches what they cover. tool/README.md ("CI") describes the jobs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request (or a branch run by hand) cancels the run it supersedes. Runs on
# main are never cancelled: each commit of main keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job names its runner image instead of ubuntu-latest: the jobs use what the image ships
# (Chrome, libsqlite3, openssl), so a new image must be a deliberate change. ubuntu-26.04 is
# the image ubuntu-latest resolved to in every run so far, the only one the jobs were seen
# green on.
#
# Order: every job starts at once except the emulator suites, the Flutter job and the size check,
# which wait only for `changes` (a few seconds) and are skipped when a change touches only
# documentation, which they cannot see (the unit jobs still run: they check the snippets of the
# READMEs). A skipped job counts as passed for a required check. They do not wait for the unit
# jobs: a broken change fails the unit check either way, and waiting added the whole unit run
# (about 10 minutes) to every pull request.
#
# Actions are pinned by commit; the comment names the release. Dependabot (dependabot.yml) keeps
# them current.
jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The file list of a pull request comes from the API.
      pull-requests: read
    outputs:
      # A run started by hand runs everything.
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
      # Whether the change touches what the browser tests cover.
      browser: ${{ github.event_name == 'workflow_dispatch' || steps.browser.outputs.browser == 'true' }}
      # Whether the change touches the IndexedDB cache engine or its check against the JS SDK.
      indexeddb: ${{ github.event_name == 'workflow_dispatch' || steps.browser.outputs.indexeddb == 'true' }}
      # Whether the change touches firebase_auth_secure_storage_dart or what runs its tests on the real stores.
      securestorage: ${{ github.event_name == 'workflow_dispatch' || steps.browser.outputs.securestorage == 'true' }}
      # Whether the change touches the Realtime Database packages or their scripts.
      database: ${{ github.event_name == 'workflow_dispatch' || steps.browser.outputs.database == 'true' }}
      # Whether the change touches the Installations or Remote Config packages or their scripts.
      remoteconfig: ${{ github.event_name == 'workflow_dispatch' || steps.browser.outputs.remoteconfig == 'true' }}
      # Whether the change touches the examples or the gallery scripts.
      gallery: ${{ github.event_name == 'workflow_dispatch' || steps.browser.outputs.gallery == 'true' }}
      # Whether the change touches firebase_error_reporting_dart or what it depends on.
      errorreporting: ${{ github.event_name == 'workflow_dispatch' || steps.browser.outputs.errorreporting == 'true' }}
      # Whether the change touches firebase_analytics_dart or what it depends on.
      analytics: ${{ github.event_name == 'workflow_dispatch' || steps.browser.outputs.analytics == 'true' }}
      # Whether the change touches firebase_transport_dart, the seam test of firebase_app_dart or the web import check.
      transport: ${{ github.event_name == 'workflow_dispatch' || steps.browser.outputs.transport == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          # `code` is true unless every changed file is documentation.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!**/LICENSE'
              - '!**/NOTICE'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: browser
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          # `browser` is true when any changed file is one of these: the library, the SQLite
          # opener package (the web opener and OPFS worker the tests use), the browser tests, and
          # what runs them.
          # `indexeddb`, `securestorage`, `database`, `remoteconfig`, `transport` and `gallery` work the same way
          # for their own jobs.
          filters: |
            browser:
              - 'cloud_firestore/cloud_firestore_dart/lib/**'
              - 'cloud_firestore/cloud_firestore_dart_sqlite/lib/**'
              - 'cloud_firestore/cloud_firestore_dart_sqlite/bin/**'
              - 'cloud_firestore/cloud_firestore_dart_sqlite/pubspec.yaml'
              - 'cloud_firestore/cloud_firestore_dart/test/browser/**'
              - 'cloud_firestore/cloud_firestore_dart/pubspec.yaml'
              - 'cloud_firestore/cloud_firestore_dart/pubspec.lock'
              - 'tool/test_browser.sh'
              - 'tool/build_web_test_assets.sh'
              - 'tool/start_private_emulator.sh'
              - 'tool/stop_private_emulator.sh'
              - 'tool/start_auth_emulators.sh'
              - 'tool/stop_auth_emulators.sh'
              - 'tool/auth_emulators/**'
              - 'tool/print_test_failures.sh'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            indexeddb:
              - 'cloud_firestore/cloud_firestore_dart/lib/indexeddb_cache.dart'
              - 'cloud_firestore/cloud_firestore_dart/lib/src/firebase/firestore/indexeddb_cache_settings.dart'
              - 'cloud_firestore/cloud_firestore_dart/lib/src/firebase/firestore/local/indexeddb/**'
              - 'cloud_firestore/cloud_firestore_dart/lib/src/firebase/firestore/index/js_index_value_writer.dart'
              - 'cloud_firestore/cloud_firestore_dart/pubspec.lock'
              - 'tool/bench/web_idb/js_import/**'
              - 'tool/bench/web_idb/pubspec.yaml'
              - 'tool/start_private_emulator.sh'
              - 'tool/stop_private_emulator.sh'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            securestorage:
              - 'firebase_auth/firebase_auth_secure_storage_dart/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            database:
              - 'firebase_database/**'
              - 'firebase_core/firebase_app_dart/lib/**'
              - 'firebase_core/firebase_app_dart/pubspec.yaml'
              - 'tool/start_database_emulator.sh'
              - 'tool/stop_database_emulator.sh'
              - 'tool/database_emulator/**'
              - 'tool/test_flutterfire_database_gate.sh'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            remoteconfig:
              - 'firebase_installations/**'
              - 'firebase_remote_config/**'
              - 'firebase_core/firebase_app_dart/lib/**'
              - 'firebase_core/firebase_app_dart/pubspec.yaml'
              - 'tool/test_browser_remote_config.sh'
              - 'tool/remote_config_fake_server.dart'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            gallery:
              - 'examples/**'
              - 'tool/build_gallery.sh'
              - 'tool/check_gallery.sh'
              - 'tool/smoke_gallery.mjs'
              # What examples/web_app resolves by path (the rtdb examples are covered by `database`; remote_config_web resolves the two packages below).
              - 'cloud_firestore/cloud_firestore_dart/lib/**'
              - 'cloud_firestore/cloud_firestore_dart/pubspec.yaml'
              - 'cloud_firestore/cloud_firestore_dart_sqlite/lib/**'
              - 'cloud_firestore/cloud_firestore_dart_sqlite/pubspec.yaml'
              - 'firebase_storage/firebase_storage_dart/lib/**'
              - 'firebase_storage/firebase_storage_dart/pubspec.yaml'
              - 'firebase_installations/firebase_installations_dart/lib/**'
              - 'firebase_installations/firebase_installations_dart/pubspec.yaml'
              - 'firebase_remote_config/firebase_remote_config_dart/lib/**'
              - 'firebase_remote_config/firebase_remote_config_dart/pubspec.yaml'
              - 'firebase_core/firebase_app_dart/lib/**'
              - 'firebase_core/firebase_app_dart/pubspec.yaml'
            errorreporting:
              - 'firebase_error_reporting/**'
              - 'firebase_core/firebase_app_dart/lib/**'
              - 'firebase_core/firebase_app_dart/pubspec.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            analytics:
              - 'firebase_analytics/firebase_analytics_dart/**'
              - 'firebase_core/firebase_app_dart/lib/**'
              - 'firebase_core/firebase_app_dart/pubspec.yaml'
              - 'tool/check_web_imports.dart'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            transport:
              - 'firebase_core/firebase_transport_dart/**'
              - 'firebase_core/firebase_app_dart/lib/**'
              - 'firebase_core/firebase_app_dart/test/**'
              - 'firebase_core/firebase_app_dart/pubspec.yaml'
              - 'tool/check_web_imports.dart'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  # The unit suite (tool/test_all.sh) runs in two parallel legs per SDK: cloud_firestore_dart
  # alone (its tests take about 9 of the 11 minutes) and every other package with the examples.
  # A package added to PACKAGES in tool/test_all.sh must be added to the `others` leg of both
  # jobs. The jobs `unit` and `unit-stable` below report the result of each SDK under the check
  # names the unit jobs had before the split.
  #
  # The lowest supported SDK (the `sdk: ^3.8.0` floor of cloud_firestore_dart). The formatting
  # check runs only here, on a pinned SDK, so that a formatter change in a new Dart release
  # cannot fail CI without a code change. `lib` is formatted identically by 3.8.0 and by the
  # SDK it was last formatted with (3.12.2); when the pin moves, reformat with the new one.
  unit-legs:
    name: Unit tests and formatting (Dart 3.8.0, ${{ matrix.leg }})
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: cloud_firestore_dart
            packages: cloud_firestore_dart
          - leg: others
            packages: >-
              secure_flow firebase_app_dart firebase_transport_dart firebase_auth_providers_dart
              cloud_firestore_dart_sqlite
              firebase_admin_dart firebase_storage_dart firebase_auth_secure_storage_dart
              firebase_database_dart firebase_database_dart_sqlite firebase_installations_dart
              firebase_remote_config_dart firebase_error_reporting_dart firebase_analytics_dart
              examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dart
        with:
          sdk: 3.8.0
      - name: Analyze and run unit tests
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/unit
          PACKAGES: ${{ matrix.packages }}
        # secure_flow has no test that may skip (its IPv6 test checks the fallback instead): a
        # skipped test there means one stopped running, and the step fails.
        run: |
          set -o pipefail
          read -ra selected <<<"$PACKAGES"
          ./tool/test_all.sh "${selected[@]}" | tee "$RUNNER_TEMP/unit_summary.txt"
          if [[ " $PACKAGES " == *" secure_flow "* ]] && ! grep -Eq \
            '^secure_flow: .*test PASS \([0-9]+ passed, 0 skipped' "$RUNNER_TEMP/unit_summary.txt"; then
            echo "::error::Tests of secure_flow were skipped or failed."
            exit 1
          fi
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-log-${{ matrix.leg }}
          path: ${{ runner.temp }}/unit/*
      # After test_all.sh, which runs `dart pub get`: the formatter takes the language version
      # (and so the style) from the resolved package. Generated protos are included; the
      # plugin and tool/gen_protos.sh emit formatted code. Each package is checked in the leg
      # that resolved it.
      - name: Check formatting (secure_flow)
        # Also when a test failed: test_all.sh has run `dart pub get` by then.
        if: ${{ !cancelled() && matrix.leg == 'others' }}
        working-directory: secure_flow/secure_flow
        run: dart format --output=none --set-exit-if-changed lib example
      - name: Check formatting (firebase_app_dart)
        # Also when a test failed: test_all.sh has run `dart pub get` by then.
        if: ${{ !cancelled() && matrix.leg == 'others' }}
        working-directory: firebase_core/firebase_app_dart
        run: dart format --output=none --set-exit-if-changed lib example
      - name: Check formatting (firebase_transport_dart)
        # Also when a test failed: test_all.sh has run `dart pub get` by then.
        if: ${{ !cancelled() && matrix.leg == 'others' }}
        working-directory: firebase_core/firebase_transport_dart
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Check formatting (cloud_firestore_dart)
        if: ${{ !cancelled() && matrix.leg == 'cloud_firestore_dart' }}
        working-directory: cloud_firestore/cloud_firestore_dart
        run: dart format --output=none --set-exit-if-changed lib example
      - name: Check formatting (firebase_auth_providers_dart)
        if: ${{ !cancelled() && matrix.leg == 'others' }}
        working-directory: firebase_auth/firebase_auth_providers_dart
        run: dart format --output=none --set-exit-if-changed lib example
      - name: Check formatting (firebase_storage_dart)
        if: ${{ !cancelled() && matrix.leg == 'others' }}
        working-directory: firebase_storage/firebase_storage_dart
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Check formatting (firebase_auth_secure_storage_dart)
        if: ${{ !cancelled() && matrix.leg == 'others' }}
        working-directory: firebase_auth/firebase_auth_secure_storage_dart
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Check formatting (firebase_database_dart)
        if: ${{ !cancelled() && matrix.leg == 'others' }}
        working-directory: firebase_database/firebase_database_dart
        # test/readme is generated by the snippet test and is not formatter-stable.
        run: |
          find lib test example -name '*.dart' -not -path 'test/readme/*' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed
      - name: Check formatting (firebase_error_reporting_dart)
        if: ${{ !cancelled() && matrix.leg == 'others' }}
        working-directory: firebase_error_reporting/firebase_error_reporting_dart
        # Without test/readme: readme_snippets_test.dart generates it and the formatter does not leave it unchanged.
        run: |
          find lib test -name '*.dart' -not -path 'test/readme/*' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed
      - name: Check formatting (firebase_database_dart_sqlite)
        if: ${{ !cancelled() && matrix.leg == 'others' }}
        working-directory: firebase_database/firebase_database_dart_sqlite
        # Without test/readme: readme_snippets_test.dart generates it and the formatter does not
        # leave it unchanged.
        run: |
          find lib test tool -name '*.dart' -not -path 'test/readme/*' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed
      - name: Check formatting (firebase_analytics_dart)
        if: ${{ !cancelled() && matrix.leg == 'others' }}
        working-directory: firebase_analytics/firebase_analytics_dart
        # test/readme is generated by the snippet test and is not formatter-stable.
        run: |
          find lib test example -name '*.dart' -not -path 'test/readme/*' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed
      - name: Lowest versions of the dependencies (firebase_auth_providers_dart)
        # The package claims `googleapis_auth: ^2.0.0`, `http: ^1.2.0` and `crypto: ^3.0.3`: run its
        # tests with the lowest versions this SDK resolves (only the runtime dependencies are
        # downgraded: the lowest versions of the test tooling do not compile on 3.8).
        if: ${{ !cancelled() && matrix.leg == 'others' }}
        working-directory: firebase_auth/firebase_auth_providers_dart
        run: |
          dart pub downgrade googleapis_auth crypto http meta
          dart pub deps --style=compact | grep -E '^- (googleapis_auth|crypto|http) '
          dart analyze --fatal-warnings lib test
          dart test --reporter expanded

  # The same on the current stable SDK, without the formatting check.
  unit-stable-legs:
    name: Unit tests (Dart stable, ${{ matrix.leg }})
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: cloud_firestore_dart
            packages: cloud_firestore_dart
          - leg: others
            packages: >-
              secure_flow firebase_app_dart firebase_transport_dart firebase_auth_providers_dart
              cloud_firestore_dart_sqlite
              firebase_admin_dart firebase_storage_dart firebase_auth_secure_storage_dart
              firebase_database_dart firebase_database_dart_sqlite firebase_installations_dart
              firebase_remote_config_dart firebase_error_reporting_dart firebase_analytics_dart
              examples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - name: Analyze and run unit tests
        env:
          TEST_LOG_DIR: ${{ runner.temp }}/unit
          PACKAGES: ${{ matrix.packages }}
        # secure_flow has no test that may skip (its IPv6 test checks the fallback instead): a
        # skipped test there means one stopped running, and the step fails.
        run: |
          set -o pipefail
          read -ra selected <<<"$PACKAGES"
          ./tool/test_all.sh "${selected[@]}" | tee "$RUNNER_TEMP/unit_summary.txt"
          if [[ " $PACKAGES " == *" secure_flow "* ]] && ! grep -Eq \
            '^secure_flow: .*test PASS \([0-9]+ passed, 0 skipped' "$RUNNER_TEMP/unit_summary.txt"; then
            echo "::error::Tests of secure_flow were skipped or failed."
            exit 1
          fi
      # The connectivity detector against a real change of the network interfaces: the test adds a dummy interface
      # with `ip`, so it runs as root (it is skipped, with a reason, everywhere else). Last, because it leaves root
      # owned files in .dart_tool. It passed in a Debian container with CAP_NET_ADMIN (tool/linux/run_in_container.sh)
      # but has not run on a GitHub runner yet: allowed to fail until it did.
      - name: Connectivity detector with a real interface change (root)
        if: ${{ !cancelled() && matrix.leg == 'cloud_firestore_dart' }}
        continue-on-error: true
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          sudo env "PATH=$PATH" FIRESTORE_TEST_NET_ADMIN=1 "$(command -v dart)" test --reporter expanded \
            test/unit/firebase/firestore/remote/connectivity_interface_change_test.dart
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-stable-log-${{ matrix.leg }}
          path: ${{ runner.temp }}/unit/*

  # One check per SDK under the old names, passed only when every leg of that SDK passed.
  unit:
    name: Unit tests and formatting (Dart 3.8.0)
    needs: unit-legs
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          RESULT: ${{ needs.unit-legs.result }}
        run: |
          echo "unit-legs: $RESULT"
          [ "$RESULT" = success ]

  unit-stable:
    name: Unit tests (Dart stable)
    needs: unit-stable-legs
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          RESULT: ${{ needs.unit-stable-legs.result }}
        run: |
          echo "unit-stable-legs: $RESULT"
          [ "$RESULT" = success ]

  # Required: the suite passed on Linux in Debian containers (arm64, and x64 under emulation;
  # tool/linux/run_in_container.sh) and in five stress runs on macOS, where one test failed once
  # (an HTTP/2 connection error in aggregation_test). transaction_test has failed rarely with an
  # increment counted twice. A failure here is a signal to look at; the full output is uploaded.
  integration:
    name: Standard emulator integration tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
        with:
          # js_interop_test.dart is skipped (with a reason) without tool/interop/node_modules.
          npm-lockfile: tool/interop/package-lock.json
      - name: Start Firestore emulator
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          firebase emulators:start --only firestore --project demo-test \
            --config firebase.json > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then echo "emulator up"; exit 0; fi
            sleep 1
          done
          echo "emulator did not start"; cat "$RUNNER_TEMP/emulator.log"; exit 1
      - name: Install the JS interop harness
        # firebase-admin and its optional @google-cloud/firestore need Node 22: on an older
        # Node, npm leaves the optional package out and the bundle test cannot load it.
        working-directory: tool/interop
        run: npm ci
      - name: Run integration tests
        env:
          TEST_LOG_DIR: ${{ runner.temp }}
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          ./tool/test_integration.sh standard
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-log
          path: ${{ runner.temp }}/*.log

  # The same standard suite over the web transport (REST and WebChannel instead of gRPC),
  # still on the VM: tool/test_integration.sh --transport=webchannel. Against a private emulator
  # started from the JAR on port 8090 (tool/start_private_emulator.sh), which is where the web
  # runs go by default. The long polling mode runs in the next job, in parallel, on its own
  # emulator: the emulator keeps one thread per WebChannel session for good (tool/README.md), so
  # each mode gets a fresh one. Required, like the job above: both modes passed in a Debian arm64
  # container.
  integration-webchannel:
    name: Standard emulator integration tests over the web transport
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
        with:
          npm-lockfile: tool/interop/package-lock.json
      - name: Start a private Firestore emulator
        run: ./tool/start_private_emulator.sh 8090
      - name: Install the JS interop harness
        working-directory: tool/interop
        run: npm ci
      - name: Run integration tests over the web transport (--transport=webchannel)
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          TEST_LOG_DIR="$EMULATOR_DIR" ./tool/test_integration.sh standard --transport=webchannel
      - name: Stop the private Firestore emulator
        if: always()
        run: ./tool/stop_private_emulator.sh 8090
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-webchannel-log
          path: ${{ runner.temp }}/emulator/*.log

  # The same with the streams in long polling mode (--transport=webchannel-longpolling). Required.
  integration-webchannel-longpolling:
    name: Standard emulator integration tests over the web transport with long polling
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
        with:
          npm-lockfile: tool/interop/package-lock.json
      - name: Start a private Firestore emulator
        run: ./tool/start_private_emulator.sh 8090
      - name: Install the JS interop harness
        working-directory: tool/interop
        run: npm ci
      - name: Run integration tests over the web transport (--transport=webchannel-longpolling)
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          TEST_LOG_DIR="$EMULATOR_DIR" ./tool/test_integration.sh standard --transport=webchannel-longpolling
      - name: Stop the private Firestore emulator
        if: always()
        run: ./tool/stop_private_emulator.sh 8090
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-webchannel-longpolling-log
          path: ${{ runner.temp }}/emulator/*.log

  # Tests that need the Enterprise edition of Firestore (test/integration_enterprise). They run
  # against a second emulator started from the emulator JAR with `--database-edition enterprise`
  # on port 8181 (tool/start_enterprise_emulator.sh); the standard emulator runs next to it on
  # 8080 for the tests that compare the two. Required: they passed in a Debian arm64 container.
  enterprise:
    name: Enterprise emulator tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
      - name: Start standard Firestore emulator
        working-directory: cloud_firestore/cloud_firestore_dart
        run: |
          mkdir -p "$EMULATOR_DIR"
          firebase emulators:start --only firestore --project demo-test \
            --config firebase.json > "$EMULATOR_DIR/emulator.log" 2>&1 &
          for _ in $(seq 1 120); do
            if curl -s -o /dev/null http://127.0.0.1:8080; then echo "emulator up"; exit 0; fi
            sleep 1
          done
          echo "emulator did not start"; cat "$EMULATOR_DIR/emulator.log"; exit 1
      - name: Start Enterprise Firestore emulator
        run: ./tool/start_enterprise_emulator.sh
      - name: Run enterprise tests
        working-directory: cloud_firestore/cloud_firestore_dart
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIRESTORE_ENTERPRISE_EMULATOR_HOST: 127.0.0.1:8181
        run: |
          dart pub get
          dart test --reporter expanded test/integration_enterprise 2>&1 | tee "$EMULATOR_DIR/enterprise.log"
          exit "${PIPESTATUS[0]}"
      - name: Stop Enterprise Firestore emulator
        if: always()
        run: ./tool/stop_enterprise_emulator.sh
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enterprise-log
          path: ${{ runner.temp }}/emulator/*.log

  # The standard integration suite (test/integration) against the Enterprise edition emulator:
  # shows whether the client behaves the same on both editions. The tests whose expectations
  # only hold for the Standard edition are skipped with a reason (see the "Enterprise edition"
  # section of the package README). Allowed to fail: in a Debian arm64 container under load one
  # chaos test (writes_chaos_test, "lose requests") counted an increment twice once and passed
  # three times on its own; the timing of that test is not yet robust on this emulator.
  standard-suite-on-enterprise:
    name: Standard suite on the Enterprise emulator (allowed to fail)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
      - name: Start Enterprise Firestore emulator
        # The whole suite fills the emulator's default heap (a quarter of the runner's memory): aggregation and
        # vector queries then fail with an empty `unknown` error. Each aggregation copies every document of the
        # database, so merge_unsent_writes_test (~31,000 documents) is skipped on this edition.
        env:
          ENTERPRISE_EMULATOR_JAVA_OPTS: -Xmx8g
        run: |
          free -g | head -2
          ./tool/start_enterprise_emulator.sh
      - name: Run the standard suite against the Enterprise emulator
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          TEST_LOG_DIR="$EMULATOR_DIR" ./tool/test_integration.sh enterprise test/integration
      - name: Stop Enterprise Firestore emulator
        if: always()
        run: ./tool/stop_enterprise_emulator.sh
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standard-suite-on-enterprise-log
          path: ${{ runner.temp }}/emulator/*.log

  # The browser tests (test/browser) in headless Chrome, compiled with dart2wasm:
  # tool/test_browser.sh, which starts its own emulator on port 8090, fetches or builds what the
  # tests load at run time (tool/build_web_test_assets.sh: sqlite3.wasm, checked against a pinned
  # sha256, and the compiled workers) and runs the test files one after the other. Only when the
  # change touches the library, the SQLite opener package, the browser tests or what runs them. Chrome is
  # preinstalled on the runner image. The nightly runs both compilers (nightly.yml). Required:
  # a regression that only shows in a browser (a page reload, the Web Lock, the storage) is not
  # seen by any other job.
  browser:
    name: Browser tests in Chrome (dart2wasm)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.browser == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
      - name: Run browser tests (dart2wasm)
        # The script exits non-zero when a test fails.
        run: |
          (cd cloud_firestore/cloud_firestore_dart && dart pub get)
          TEST_LOG_DIR="$EMULATOR_DIR" ./tool/test_browser.sh dart2wasm
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-log
          path: ${{ runner.temp }}/emulator/*.log

  # The whole test tree of firebase_error_reporting_dart in Chrome, with dart2js and with dart2wasm (the VM-only
  # files are marked @TestOn('vm')). No emulator: the tests use MockClient.
  error-reporting-browser:
    name: Error Reporting tests in Chrome (dart2js and dart2wasm)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.errorreporting == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - name: Run the tests in Chrome
        working-directory: firebase_error_reporting/firebase_error_reporting_dart
        run: |
          dart pub get
          dart test -p chrome
          dart test -p chrome -c dart2wasm

  # firebase_analytics_dart in headless Chrome, compiled with dart2js and with dart2wasm: its unit tests
  # (MockClient, fake_async; nothing reaches Google Analytics) except those marked @TestOn('vm'), after a
  # check that the main library reaches neither dart:io nor dart:ffi.
  analytics-browser:
    name: Analytics tests in Chrome (dart2js and dart2wasm)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.analytics == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - name: Check that the main library imports neither dart:io nor dart:ffi
        run: |
          (cd firebase_analytics/firebase_analytics_dart && dart pub get)
          dart tool/check_web_imports.dart firebase_analytics/firebase_analytics_dart
      - name: Run the tests in Chrome
        working-directory: firebase_analytics/firebase_analytics_dart
        run: |
          dart test -p chrome
          dart test -p chrome -c dart2wasm

  # firebase_transport_dart in headless Chrome, compiled with dart2js and with dart2wasm, and the seam test of
  # firebase_app_dart (the only test of that package that runs in a browser), after a check that the transport
  # library reaches neither dart:io nor dart:ffi.
  transport-browser:
    name: Transport and app tests in Chrome (dart2js and dart2wasm)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.transport == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - name: Check that the library imports neither dart:io nor dart:ffi
        run: |
          (cd firebase_core/firebase_transport_dart && dart pub get)
          dart tool/check_web_imports.dart firebase_core/firebase_transport_dart
      - name: Run the transport tests in Chrome
        working-directory: firebase_core/firebase_transport_dart
        run: |
          dart test -p chrome
          dart test -p chrome -c dart2wasm
      - name: Run the seam test of firebase_app_dart in Chrome
        working-directory: firebase_core/firebase_app_dart
        run: |
          dart pub get
          dart test -p chrome test/app_check_seam_test.dart
          dart test -p chrome -c dart2wasm test/app_check_seam_test.dart

  # The IndexedDB cache engine against the official JS SDK in headless Chrome, both ways, on one database at a time:
  # tool/bench/web_idb/js_import/interop_check.sh (documents, pending writes of two users, indexes, bundles and garbage
  # collection written by each SDK and read by the other, the primary lease, index entries of every value kind). The
  # firebase JS SDK and esbuild come from npm at the versions of its package-lock.json (`npm ci`, cached by the
  # emulators action), like the harness of tool/interop; the pages are served from 127.0.0.1 and talk to a private
  # emulator only. Only when the change touches the engine or the check. Required: no other job runs the real JS SDK
  # on the engine's database.
  indexeddb-interop:
    name: IndexedDB cache interop with the JS SDK (Chrome)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.indexeddb == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
        with:
          npm-lockfile: tool/bench/web_idb/js_import/package-lock.json
      - name: Install the JS SDK and esbuild
        working-directory: tool/bench/web_idb/js_import
        run: npm ci --no-audit --no-fund
      - name: Start a private Firestore emulator
        run: ./tool/start_private_emulator.sh 8395
      - name: Run the interop check
        env:
          CHROME: google-chrome
        run: |
          set -o pipefail
          ./tool/bench/web_idb/js_import/interop_check.sh 8395 2>&1 | tee "$EMULATOR_DIR/interop.log"
      - name: Stop the private Firestore emulator
        if: always()
        run: ./tool/stop_private_emulator.sh 8395
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexeddb-interop-log
          path: ${{ runner.temp }}/emulator/*.log

  # firebase_storage_dart against the Firebase Storage emulator (test/integration), which
  # tool/start_storage_emulator.sh starts on 9299 with an open bucket and one whose rules need a
  # signed-in user. The rules runtime JAR is fetched by `firebase setup:emulators:storage` (the
  # emulators action caches ~/.cache/firebase/emulators, so it is downloaded once per CLI
  # version). A skipped test means FIREBASE_STORAGE_EMULATOR_HOST did not reach it: the step fails then.
  # Starts at once, in parallel with the other emulator suites, so it adds no time to a run.
  storage:
    name: Storage emulator integration tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
      - name: Download the Storage rules runtime
        # Does nothing when the cache restored the JAR of this CLI version.
        run: firebase setup:emulators:storage
      - name: Start the Storage emulator
        run: ./tool/start_storage_emulator.sh 9299
      - name: Start the Auth emulator (the verification kit's throwaway user)
        run: ./tool/start_auth_emulators.sh 9398 9397
      - name: Run the emulator tests of firebase_storage_dart
        working-directory: firebase_storage/firebase_storage_dart
        env:
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9299
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9398
        # One test file at a time: the emulator's rules runtime stalls under concurrent uploads from
        # several files ("no Storage ruleset is currently loaded").
        run: |
          set -o pipefail
          dart pub get
          dart test -j 1 --reporter expanded test/integration test/production 2>&1 | tee "$EMULATOR_DIR/storage_integration.log"
          if grep -Eq ' ~[0-9]+' "$EMULATOR_DIR/storage_integration.log"; then
            echo "::error::The Storage emulator tests skipped: FIREBASE_STORAGE_EMULATOR_HOST did not reach them."
            exit 1
          fi
      - name: Stop the Storage emulator
        if: always()
        run: ./tool/stop_storage_emulator.sh 9299
      - name: Stop the Auth emulator
        if: always()
        run: ./tool/stop_auth_emulators.sh 9398 9397
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storage-log
          path: ${{ runner.temp }}/emulator/*.log

  # firebase_database_dart against the Realtime Database emulator (test/integration, tag
  # `emulator`), which tool/start_database_emulator.sh starts on 9100 with open rules. The
  # emulator JAR is fetched by `firebase setup:emulators:database`, as the Storage job fetches its
  # rules runtime. The two tests tagged `emulator-slow` (minutes each) are skipped by
  # dart_test.yaml; any other skip means FIREBASE_DATABASE_EMULATOR_HOST did not reach the tests,
  # and the step fails then. Starts at once, in parallel with the other emulator suites.
  database:
    name: Realtime Database emulator integration tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
      - name: Download the Database emulator
        # Does nothing when the cache restored the JAR of this CLI version.
        run: firebase setup:emulators:database
      - name: Start the Database emulator
        run: ./tool/start_database_emulator.sh 9100
      - name: Run the emulator tests of firebase_database_dart
        working-directory: firebase_database/firebase_database_dart
        env:
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9100
          # The tests tagged `emulator-slow`, which dart_test.yaml skips.
          EXPECTED_SKIPS: '2'
        # One test file at a time, the run dart_test.yaml of the package documents.
        run: |
          set -o pipefail
          dart pub get
          dart test -t emulator -j 1 --reporter expanded --no-color test/integration 2>&1 \
            | tee "$EMULATOR_DIR/database_integration.log"
          if ! grep -Eq "^[0-9:]+ \+[1-9][0-9]* ~$EXPECTED_SKIPS: All tests passed!\$" \
            "$EMULATOR_DIR/database_integration.log"; then
            echo "::error::The Database emulator tests did not all run: a skip count other than" \
              "$EXPECTED_SKIPS means FIREBASE_DATABASE_EMULATOR_HOST did not reach them."
            exit 1
          fi
      - name: Stop the Database emulator
        if: always()
        run: ./tool/stop_database_emulator.sh 9100
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-log
          path: ${{ runner.temp }}/emulator/*.log

  # The tests of firebase_database_dart in headless Chrome, on both compilers (`dart test -p chrome`
  # over the whole test tree; the files marked @TestOn('vm') drop out by themselves). No emulator.
  # Only when the change touches the Database packages, firebase_app_dart, their scripts, ci.yml
  # or .github/actions/. Required: no other job runs the client on the web.
  database-browser:
    name: Realtime Database tests in Chrome (${{ matrix.compiler }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [dart2js, dart2wasm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - name: Run the tests in Chrome
        working-directory: firebase_database/firebase_database_dart
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          set -o pipefail
          dart pub get
          dart test -p chrome -c "$COMPILER" --reporter expanded --no-color 2>&1 \
            | tee "$RUNNER_TEMP/database_browser.log"
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-browser-log-${{ matrix.compiler }}
          path: ${{ runner.temp }}/database_browser.log

  # The browser tests of firebase_installations_dart and firebase_remote_config_dart in headless Chrome,
  # on both compilers, against the fake server of tool/remote_config_fake_server.dart (started and
  # stopped by tool/test_browser_remote_config.sh). Only when the change touches the two packages,
  # firebase_app_dart, their scripts, ci.yml or .github/actions/. Required: no other job runs the
  # clients on the web.
  remote-config-browser:
    name: Remote Config tests in Chrome (${{ matrix.compiler }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.remoteconfig == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [dart2js, dart2wasm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - name: Check that the web libraries import neither dart:io nor dart:ffi
        run: |
          (cd firebase_installations/firebase_installations_dart && dart pub get)
          (cd firebase_remote_config/firebase_remote_config_dart && dart pub get)
          dart tool/check_web_imports.dart firebase_installations/firebase_installations_dart \
            lib/firebase_installations_dart.dart lib/web.dart
          dart tool/check_web_imports.dart firebase_remote_config/firebase_remote_config_dart
      - name: Run the tests in Chrome
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          set -o pipefail
          ./tool/test_browser_remote_config.sh "$COMPILER" 2>&1 \
            | tee "$RUNNER_TEMP/remote_config_browser.log"
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-config-browser-log-${{ matrix.compiler }}
          path: ${{ runner.temp }}/remote_config_browser.log

  # The acceptance gate of firebase_database_dart_platform: FlutterFire's own firebase_database
  # example integration tests (77) against the shim and a Database emulator on 9100
  # (tool/test_flutterfire_database_gate.sh, which starts and stops the emulator itself). It needs
  # FlutterFire at the commit the script pins, checked out sparsely next to this repository, and a
  # Flutter whose Dart is at least 3.13 (FlutterFire's example does not resolve on 3.44.9). Only
  # when the change touches the Database packages or their scripts. Allowed to fail until it has
  # passed on a runner: it passed on macOS (76 passed, 1 skipped), not yet on Linux.
  database-flutterfire-gate:
    name: FlutterFire firebase_database tests on the shim (Flutter 3.47.8, allowed to fail)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The commit pinned as PINNED_COMMIT in tool/test_flutterfire_database_gate.sh; move both
      # together.
      - name: Check out FlutterFire at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: firebase/flutterfire
          ref: 6a80b1b5eea1ea86ba8c7e7bf2a8525cabb77126
          path: flutterfire
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            packages/firebase_database
            .github
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - uses: ./.github/actions/emulators
      - name: Download the Database emulator
        # Does nothing when the cache restored the JAR of this CLI version.
        run: firebase setup:emulators:database
      - name: Run the gate
        env:
          GATE_DATABASE_PORT: '9100'
        run: |
          flutter --version
          FLUTTERFIRE_DIR="$GITHUB_WORKSPACE/flutterfire" ./tool/test_flutterfire_database_gate.sh
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-flutterfire-gate-log
          path: ${{ runner.temp }}/emulator/*.log

  # The web gallery: tool/build_gallery.sh compiles each web example with dart2wasm and dart2js
  # into build/gallery, tool/check_gallery.sh checks the built entry files and every file each
  # index.html references, and tool/smoke_gallery.mjs clicks through rtdb_web_app and
  # rtdb_playground in headless Chrome on both builds (Node's own WebSocket, no npm package),
  # with the pages served from 127.0.0.1:8080 and a Database emulator on 9100, the script's
  # defaults. The script writes no screenshots: its output is the log. Only when the change
  # touches what the `database` filter covers, the examples or the three gallery scripts.
  # Required: no other job compiles the examples to the web or runs them in a browser.
  gallery:
    name: Web gallery build and smoke test (Chrome)
    needs: changes
    if: >-
      ${{ needs.changes.outputs.code == 'true' && (needs.changes.outputs.database == 'true' ||
      needs.changes.outputs.gallery == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - uses: ./.github/actions/emulators
      - name: Build the gallery
        run: ./tool/build_gallery.sh
      - name: Check the built files
        run: ./tool/check_gallery.sh
      - name: Test the examples whose tests need no emulator
        # The tests of the two playgrounds run on the VM with no backend. tool/test_all.sh analyzes the
        # examples and runs the tests of those with a .test_without_emulator file.
        run: |
          for example in playground rtdb_playground; do
            echo "::group::examples/$example"
            (cd "examples/$example" && dart pub get && dart test)
            echo "::endgroup::"
          done
      - name: Download the Database emulator
        # Does nothing when the cache restored the JAR of this CLI version.
        run: firebase setup:emulators:database
      - name: Start the Database emulator
        run: ./tool/start_database_emulator.sh 9100
      - name: Smoke test the Realtime Database examples (dart2js and dart2wasm)
        env:
          CHROME: google-chrome
        run: |
          set -o pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 --directory build/gallery \
            > "$EMULATOR_DIR/http_server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 1
          done
          if ! curl -sf -o /dev/null http://127.0.0.1:8080/; then
            echo "::error::The HTTP server of build/gallery did not answer on 127.0.0.1:8080."
            cat "$EMULATOR_DIR/http_server.log"
            exit 1
          fi
          node tool/smoke_gallery.mjs 2>&1 | tee "$EMULATOR_DIR/smoke_gallery.log"
      - name: Stop the Database emulator
        if: always()
        run: ./tool/stop_database_emulator.sh 9100
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-log
          path: ${{ runner.temp }}/emulator/*.log

  # firebase_auth_secure_storage_dart against the real secret store of each system
  # (test/integration, skipped without FIREBASE_AUTH_SECURE_STORAGE_INTEGRATION=1; the unit legs run
  # the rest of its tests). Only when a change touches the package, ci.yml or .github/actions/. Each
  # job runs the command of the package README ("Integration tests") and fails when no test passed
  # or one was skipped: a test that skips has not touched the store. The expanded reporter ends with
  # "+<passed>: All tests passed!" only when nothing was skipped ("+<passed> ~<skipped>: ..."
  # otherwise).
  #
  # Linux: libsecret over the Secret Service of gnome-keyring, in a session bus of its own
  # (dbus-run-session) with the login keyring created and unlocked with a throwaway password (with an empty one
  # gnome-keyring-daemon creates no login keyring, and every write then needs a prompt).
  # secret-tool (libsecret-tools) lets the test check the attributes of the stored item. The test
  # also runs test/integration/linux_no_bus.dart in a child process with a bus that does not exist,
  # so that program needs no step of its own. Required.
  secure-storage-linux:
    name: Secure storage on the Secret Service (Linux, libsecret)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.securestorage == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - name: Install libsecret, gnome-keyring and D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecret-1-0 libsecret-tools gnome-keyring dbus
          command -v dbus-run-session gnome-keyring-daemon secret-tool
      - name: Run the integration tests
        working-directory: firebase_auth/firebase_auth_secure_storage_dart
        env:
          FIREBASE_AUTH_SECURE_STORAGE_INTEGRATION: '1'
        run: |
          set -o pipefail
          dart pub get
          dbus-run-session -- sh -c 'printf "test\n" | gnome-keyring-daemon --unlock --components=secrets >/dev/null &&
            dart test --reporter expanded --no-color test/integration/linux_libsecret_test.dart' 2>&1 \
            | tee "$RUNNER_TEMP/secure_storage_linux.log"
          if ! grep -Eq '^[0-9:]+ \+[1-9][0-9]*: All tests passed!$' "$RUNNER_TEMP/secure_storage_linux.log"; then
            echo "::error::No integration test of the Secret Service passed, or one was skipped."
            exit 1
          fi

  # Windows: DPAPI-encrypted files in %LOCALAPPDATA%\<service>. DPAPI needs the profile of a logged
  # on user; whether the hosted runner's account has one that DPAPI accepts is what this job shows.
  # setup-dart directly instead of ./.github/actions/dart: that action caches ~/.pub-cache, while
  # pub keeps its cache in %LOCALAPPDATA%\Pub\Cache on Windows. Bash (Git for Windows) so that the
  # check of the output is the same as on Linux. Required.
  secure-storage-windows:
    name: Secure storage on DPAPI (Windows)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.securestorage == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable
      - name: Run the integration tests
        working-directory: firebase_auth/firebase_auth_secure_storage_dart
        env:
          FIREBASE_AUTH_SECURE_STORAGE_INTEGRATION: '1'
        run: |
          set -o pipefail
          echo "LOCALAPPDATA=$LOCALAPPDATA"
          dart pub get
          dart test --reporter expanded --no-color test/integration/windows_dpapi_test.dart 2>&1 \
            | tee "$RUNNER_TEMP/secure_storage_windows.log"
          if ! grep -Eq '^[0-9:]+ \+[1-9][0-9]*: All tests passed!' "$RUNNER_TEMP/secure_storage_windows.log"; then
            echo "::error::No integration test of DPAPI passed, or one was skipped."
            exit 1
          fi

  # macOS: the login keychain of the runner's user, through Security.framework. The README asks for a
  # desktop session because the keychain is locked over SSH and macOS cannot prompt; a hosted runner
  # logs its user in, but whether its login keychain is the unlocked default keychain is not known
  # yet. Allowed to fail until it has passed on a runner.
  secure-storage-macos:
    name: Secure storage on the login keychain (macOS, allowed to fail)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.securestorage == 'true' }}
    runs-on: macos-26
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - name: Show the keychains
        run: |
          security default-keychain
          security list-keychains
      - name: Run the integration tests
        working-directory: firebase_auth/firebase_auth_secure_storage_dart
        env:
          FIREBASE_AUTH_SECURE_STORAGE_INTEGRATION: '1'
        run: |
          set -o pipefail
          dart pub get
          dart test --reporter expanded --no-color test/integration/macos_keychain_test.dart 2>&1 \
            | tee "$RUNNER_TEMP/secure_storage_macos.log"
          if ! grep -Eq '^[0-9:]+ \+[1-9][0-9]*: All tests passed!$' "$RUNNER_TEMP/secure_storage_macos.log"; then
            echo "::error::No integration test of the login keychain passed, or one was skipped."
            exit 1
          fi

  # The Flutter packages, which the unit jobs skip (they install Dart only): flutter analyze and
  # flutter test of cloud_firestore_dart_flutterfire, cloud_firestore_dart_platform,
  # firebase_auth_dart_platform, firebase_storage_dart_platform, firebase_database_dart_platform,
  # firebase_remote_config_dart_platform (unit tests only, fakes of the two endpoints),
  # firebase_analytics_dart_platform (unit tests only, a MockClient relay) and
  # firebase_auth_secure_storage_flutter (unit tests only, against a fake of the plugin's
  # channel), the emulator tests of the three platform packages included
  # (FIRESTORE_EMULATOR_HOST: 15 of the Firestore package's 29 tests skip without it;
  # FIREBASE_AUTH_EMULATOR_HOST, from tool/start_auth_emulators.sh, for the Auth package;
  # FIREBASE_DATABASE_EMULATOR_HOST, from tool/start_database_emulator.sh on 9100, for the Database
  # package: 5 of its tests skip without it), flutter analyze of examples/flutter_notes and of the
  # desktop examples (flutterfire_on_linux, flutterfire_on_windows, flutterfire_storage_on_linux,
  # flutterfire_database_on_linux, flutterfire_database_on_windows; analyze only, no build), and
  # flutter analyze and the web builds
  # (`flutter build web` and `flutter build web --wasm`) of examples/flutter_web_two_users. Through tool/test_all.sh, with
  # TEST_ALL_REQUIRE_FLUTTER=1 so that a missing Flutter fails the job instead of skipping. The
  # emulator is a private one on 8090 (tool/start_private_emulator.sh), as in the web transport
  # job. Required: nothing else checks these packages.
  flutter:
    name: Flutter packages (Flutter stable)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the emulator work directory
        # The `runner` context is not available in job-level `env`.
        run: echo "EMULATOR_DIR=$RUNNER_TEMP/emulator" >> "$GITHUB_ENV"
      # A pinned version, not the newest stable: Flutter 3.50 deprecates
      # `package:flutter/material.dart` in favour of `package:material_ui`, which the examples
      # do not use yet, and the job treats analyzer infos as failures.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - uses: ./.github/actions/emulators
      - name: Start a private Firestore emulator
        run: ./tool/start_private_emulator.sh 8090
      - name: Start the Auth emulator
        # Also starts a Firestore emulator on 8197, which nothing here uses.
        run: ./tool/start_auth_emulators.sh 9197 8197
      - name: Download the Database emulator
        # Does nothing when the cache restored the JAR of this CLI version.
        run: firebase setup:emulators:database
      - name: Start the Database emulator
        run: ./tool/start_database_emulator.sh 9100
      - name: Analyze and test the Flutter packages, analyze and build the Flutter examples
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8090
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9197
          FIREBASE_DATABASE_EMULATOR_HOST: 127.0.0.1:9100
          TEST_ALL_REQUIRE_FLUTTER: '1'
          TEST_LOG_DIR: ${{ runner.temp }}/emulator/flutter
        # A skipped test of a platform package means the emulator did not reach it: the step
        # fails then.
        run: |
          set -o pipefail
          flutter --version
          ./tool/test_all.sh cloud_firestore_dart_flutterfire cloud_firestore_dart_platform \
            firebase_auth_dart_platform firebase_storage_dart_platform \
            firebase_database_dart_platform firebase_remote_config_dart_platform \
            firebase_analytics_dart_platform firebase_auth_secure_storage_flutter \
            examples/flutter_notes examples/flutter_web_two_users \
            examples/flutterfire_on_linux \
            examples/flutterfire_on_windows \
            examples/flutterfire_storage_on_linux \
            examples/flutterfire_database_on_linux \
            examples/flutterfire_database_on_windows 2>&1 \
            | tee "$RUNNER_TEMP/flutter_summary.txt"
          if ! grep -Eq '^cloud_firestore_dart_platform: .*test PASS \([0-9]+ passed, 0 skipped' \
            "$RUNNER_TEMP/flutter_summary.txt"; then
            echo "::error::Tests of cloud_firestore_dart_platform were skipped: FIRESTORE_EMULATOR_HOST did not reach them."
            exit 1
          fi
          if ! grep -Eq '^firebase_auth_dart_platform: .*test PASS \([0-9]+ passed, 0 skipped' \
            "$RUNNER_TEMP/flutter_summary.txt"; then
            echo "::error::Tests of firebase_auth_dart_platform were skipped: FIREBASE_AUTH_EMULATOR_HOST did not reach them."
            exit 1
          fi
          if ! grep -Eq '^firebase_auth_secure_storage_flutter: .*test PASS \([0-9]+ passed, 0 skipped' \
            "$RUNNER_TEMP/flutter_summary.txt"; then
            echo "::error::Tests of firebase_auth_secure_storage_flutter were skipped."
            exit 1
          fi
          if ! grep -Eq '^firebase_database_dart_platform: .*test PASS \([0-9]+ passed, 0 skipped' \
            "$RUNNER_TEMP/flutter_summary.txt"; then
            echo "::error::Tests of firebase_database_dart_platform were skipped: FIREBASE_DATABASE_EMULATOR_HOST did not reach them."
            exit 1
          fi
      - name: Stop the private Firestore emulator
        if: always()
        run: ./tool/stop_private_emulator.sh 8090
      - name: Stop the Auth emulator
        if: always()
        run: ./tool/stop_auth_emulators.sh 9197 8197
      - name: Stop the Database emulator
        if: always()
        run: ./tool/stop_database_emulator.sh 9100
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-log
          path: |
            ${{ runner.temp }}/emulator/*.log
            ${{ runner.temp }}/emulator/flutter/*

  # The size of a program that uses Firestore Lite, and that it does not contain the sync
  # engine, the local store or WebChannel, and the size of the same program on the main library
  # (tool/check_size.sh, budgets in tool/size/check_size.dart). Pinned to the SDK the budgets
  # were measured with: most of the compiled program is the Dart runtime, so the numbers move
  # with the SDK. When the pin moves, measure again and update the budgets and the README.
  # Allowed to fail.
  size:
    name: Web size check, lite and full (Dart 3.12.2, allowed to fail)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dart
        with:
          sdk: 3.12.2
      - name: Compile the sample applications and check them against their budgets
        env:
          SIZE_OUT_DIR: ${{ runner.temp }}/size
        run: ./tool/check_size.sh
