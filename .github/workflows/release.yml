name: Release check

# Validates a release when a version tag is pushed. It does NOT publish anything.
#
# Publishing to pub.dev stays a manual step that the maintainer runs and approves, from
# their own machine and account (`dart pub publish` in each package, in the order below; see the
# release notes of the packages). This workflow has no credentials for pub.dev and must never
# get any: there is no `dart pub publish` without `--dry-run` here, no OIDC token permission and
# no secret.
#
# Tags:
#   v<version>                 all three packages, which must all be at <version>
#   <package>-v<version>       one package, for example cloud_firestore_dart-v0.1.1
#
# For each package of the tag, in dependency order (firebase_app_dart, which the two others
# depend on, then firebase_auth_providers_dart, then cloud_firestore_dart, which has it as a dev
# dependency): the version in pubspec.yaml is the version of the tag, CHANGELOG.md has a
# `## <version>` heading, and `dart pub publish --dry-run` passes.
on:
  push:
    tags:
      - 'v[0-9]*'
      - '*-v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to check, as if it had been pushed (for example v0.1.0).
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the release (dry run, nothing is published)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/dart
        with:
          sdk: stable
      - name: Check the versions, the changelogs and the dry runs
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -u
          # In dependency order.
          packages="firebase_core/firebase_app_dart firebase_auth/firebase_auth_providers_dart cloud_firestore/cloud_firestore_dart"
          case "$TAG" in
            v[0-9]*) version="${TAG#v}"; only="" ;;
            *-v[0-9]*) version="${TAG##*-v}"; only="${TAG%-v*}" ;;
            *) echo "::error::Not a version tag: $TAG"; exit 1 ;;
          esac
          checked=0
          failed=0
          for dir in $packages; do
            name="$(basename "$dir")"
            if [ -n "$only" ] && [ "$only" != "$name" ]; then continue; fi
            checked=$((checked + 1))
            echo "::group::$name $version"
            actual="$(sed -n 's/^version: *//p' "$dir/pubspec.yaml" | head -1)"
            if [ "$actual" != "$version" ]; then
              echo "::error file=$dir/pubspec.yaml::$name is at version $actual, the tag says $version"
              failed=1
            fi
            if ! grep -Eq "^## \\[?${version//./\\.}\\]?( |$)" "$dir/CHANGELOG.md"; then
              echo "::error file=$dir/CHANGELOG.md::No '## $version' heading in the changelog of $name"
              failed=1
            fi
            # A dry run only: it checks the archive and the pubspec and uploads nothing.
            if ! (cd "$dir" && dart pub get && dart pub publish --dry-run); then
              echo "::error::The dry run of $name failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::No package is named $only"
            exit 1
          fi
          exit "$failed"
