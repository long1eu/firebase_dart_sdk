name: Release check

# Validates a release when a version tag is pushed. It does NOT publish anything.
#
# Publishing is done by `publish.yml`, one package per `<package>-v<version>` tag, after the
# maintainer approves the run. This workflow has no credentials for pub.dev and must never get
# any: there is no `dart pub publish` without `--dry-run` here, no OIDC token permission and no
# secret.
#
# Tags:
#   v<version>                 the three core packages (firebase_app_dart,
#                              firebase_auth_providers_dart, cloud_firestore_dart), which must all
#                              be at <version>
#   <package>-v<version>       one of the twelve packages that publish.yml publishes, for example
#                              cloud_firestore_dart-v0.1.1 or firebase_admin_dart-v0.1.0
#
# For each package of the tag, in dependency order (the same order as publish.yml:
# secure_flow, firebase_app_dart, firebase_auth_providers_dart, cloud_firestore_dart, then
# cloud_firestore_dart_sqlite, cloud_firestore_dart_flutterfire, cloud_firestore_dart_platform,
# firebase_auth_secure_storage_flutter, firebase_auth_dart_platform (needs firebase_auth_providers_dart 0.3.1 and
# firebase_auth_secure_storage_flutter, so release those first),
# firebase_admin_dart, firebase_storage_dart, firebase_storage_dart_platform): the version in pubspec.yaml is the
# version of the tag, CHANGELOG.md has a `## <version>` heading, and `pub publish --dry-run` passes (with Flutter
# for the five Flutter packages).
on:
  push:
    tags:
      - 'v[0-9]*'
      - '*-v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to check, as if it had been pushed (for example v0.1.0).
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the release (dry run, nothing is published)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find the packages of the tag
        id: packages
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          # In dependency order. A v<version> tag checks the three core packages only.
          core="firebase_core/firebase_app_dart firebase_auth/firebase_auth_providers_dart cloud_firestore/cloud_firestore_dart"
          all="secure_flow/secure_flow $core cloud_firestore/cloud_firestore_dart_sqlite cloud_firestore/cloud_firestore_dart_flutterfire cloud_firestore/cloud_firestore_dart_platform firebase_auth/firebase_auth_secure_storage_flutter firebase_auth/firebase_auth_dart_platform firebase_admin/firebase_admin_dart firebase_storage/firebase_storage_dart firebase_storage/firebase_storage_dart_platform"
          case "$TAG" in
            v[0-9]*) version="${TAG#v}"; dirs="$core" ;;
            *-v[0-9]*)
              version="${TAG##*-v}"
              only="${TAG%-v*}"
              dirs=""
              for dir in $all; do
                if [ "$(basename "$dir")" = "$only" ]; then dirs="$dir"; fi
              done
              if [ -z "$dirs" ]; then
                echo "::error::No package is named $only"
                exit 1
              fi
              ;;
            *) echo "::error::Not a version tag: $TAG"; exit 1 ;;
          esac
          flutter=false
          for dir in $dirs; do
            if grep -Eq '^\s*sdk:\s*flutter\s*$' "$dir/pubspec.yaml"; then flutter=true; fi
          done
          {
            echo "version=$version"
            echo "dirs=$dirs"
            echo "flutter=$flutter"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/dart
        if: steps.packages.outputs.flutter == 'false'
        with:
          sdk: stable
      - name: Set up Flutter
        if: steps.packages.outputs.flutter == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - name: Check the versions, the changelogs and the dry runs
        env:
          VERSION: ${{ steps.packages.outputs.version }}
          DIRS: ${{ steps.packages.outputs.dirs }}
        run: |
          set -u
          version="$VERSION"
          failed=0
          for dir in $DIRS; do
            name="$(basename "$dir")"
            echo "::group::$name $version"
            actual="$(sed -n 's/^version: *//p' "$dir/pubspec.yaml" | head -1)"
            if [ "$actual" != "$version" ]; then
              echo "::error file=$dir/pubspec.yaml::$name is at version $actual, the tag says $version"
              failed=1
            fi
            if ! grep -Eq "^## \\[?${version//./\\.}\\]?( |$)" "$dir/CHANGELOG.md"; then
              echo "::error file=$dir/CHANGELOG.md::No '## $version' heading in the changelog of $name"
              failed=1
            fi
            # A dry run only: it checks the archive and the pubspec and uploads nothing.
            if grep -Eq '^\s*sdk:\s*flutter\s*$' "$dir/pubspec.yaml"; then pub="flutter pub"; else pub="dart pub"; fi
            if ! (cd "$dir" && $pub get && $pub publish --dry-run); then
              echo "::error::The dry run of $name failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
