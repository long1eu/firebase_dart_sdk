name: firebase_admin_dart
description: >-
  Unofficial, light, pure-Dart Firebase admin calls for servers, CLIs and tests:
  Auth custom tokens, users, custom claims, revocation and ID token checks.
version: 0.1.2
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/firebase_admin/firebase_admin_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - authentication
  - server
  - testing

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  crypto: ^3.0.3
  # Local development resolves these from the sibling checkouts through
  # pubspec_overrides.yaml (not published).
  firebase_app_dart: ^0.2.0
  firebase_auth_providers_dart: '>=0.2.0 <0.5.0'
  http: ^1.2.0
  meta: ^1.11.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
