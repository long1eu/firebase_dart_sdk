name: firebase_auth_providers_dart
description: >-
  Unofficial pure-Dart token providers for firebase_app_dart and
  cloud_firestore_dart: service accounts, Application Default Credentials and
  Firebase Auth user sign-in over REST.
version: 0.1.0
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/firebase_auth/firebase_auth_providers_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - firestore
  - authentication
  - server

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  crypto: ^3.0.3
  # Local development resolves this from ../../firebase_core/firebase_app_dart
  # through pubspec_overrides.yaml (not published).
  firebase_app_dart: ^0.1.0
  # Service account keys and Application Default Credentials. Already part of
  # the dependency graph of cloud_firestore_dart (through package:grpc), like
  # crypto and http.
  googleapis_auth: ^2.0.0
  http: ^1.2.0
  meta: ^1.11.0

dev_dependencies:
  test: ^1.25.0
