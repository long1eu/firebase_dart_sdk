name: firebase_auth_secure_storage_dart
description: >-
  Unofficial secure storage for the Firebase Auth session of
  firebase_auth_providers_dart in command line tools and servers, without
  Flutter: the macOS Keychain, libsecret on Linux and DPAPI on Windows, through
  dart:ffi.
version: 0.1.0
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/firebase_auth/firebase_auth_secure_storage_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - authentication
  - secure-storage
  - keychain

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  # SHA-256 of the executable path in the default namespace, and of the key in
  # the file names on Windows. Already part of the dependency graph through
  # firebase_auth_providers_dart, with this constraint.
  crypto: ^3.0.3
  # C strings, calloc and arenas for the calls into Security.framework,
  # libsecret and crypt32. Already part of the dependency graph of
  # firebase_auth_providers_dart (2.2.0 in its lock file).
  ffi: ^2.2.0
  # Local development resolves firebase_auth_providers_dart (and its
  # firebase_app_dart and secure_flow) from the sibling packages through
  # pubspec_overrides.yaml (not published). AuthStorage is the interface this
  # package implements.
  firebase_auth_providers_dart: ^0.4.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
