name: firebase_ai_dart
description: >-
  Firebase AI Logic for pure Dart: Gemini models through Firebase, with App Check
  and Auth, on the VM and the web.
version: 0.1.0
homepage: https://github.com/long1eu/firebase_dart_sdk
repository: https://github.com/long1eu/firebase_dart_sdk/tree/main/firebase_ai/firebase_ai_dart
issue_tracker: https://github.com/long1eu/firebase_dart_sdk/issues
topics:
  - firebase
  - ai
  - gemini
  - generative-ai

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  # The token rule, headers, capped send, SSE decoder and status mapping. Resolved from
  # ../../firebase_core/_firebase_transport_dart through pubspec_overrides.yaml in this repository.
  _firebase_transport_dart: ^0.1.0
  # 0.2.3: LimitedUseAppCheckTokenProvider. Resolved from ../../firebase_core/firebase_app_dart through
  # pubspec_overrides.yaml in this repository.
  firebase_app_dart: ^0.2.3
  # 1.6.0: AbortableRequest, and BrowserClient streams response bodies.
  http: ^1.6.0
  meta: ^1.11.0

dev_dependencies:
  args: ^2.5.0
  fake_async: ^1.3.0
  lints: ^6.1.0
  test: ^1.25.0
